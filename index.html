<style>
  :root{
    --bg:#FBF2F6;
    --bg-card:#FFFFFF;
    --bg-cream:#FFF8F3;
    --lav:#C3AEE0;
    --lav-dark:#8E6FBE;
    --lav-pale:#EFE6F8;
    --text:#4A3B52;
    --muted:#9A8AA3;
    --border:#F0DCE6;
    --success:#6FAE84;
    --success-bg:#E9F5EC;
    --warn:#D99A3F;
    --warn-bg:#FBF0DE;
    --danger:#D9748A;
    --danger-bg:#FBE7EC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Poppins','Segoe UI',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Quicksand','Poppins',sans-serif; font-weight:700; }
  #app{max-width:1420px;margin:0 auto;padding:20px 16px 60px;}

  .header{
    background:linear-gradient(135deg,var(--lav) 0%,#D9C3EE 100%);
    border-radius:22px; padding:22px 24px; color:#fff; position:relative; overflow:hidden; margin-bottom:18px;
  }
  .header::after{
    content:""; position:absolute; right:-30px;top:-30px; width:140px;height:140px;
    border-radius:50%; background:rgba(255,255,255,0.15);
  }
  .header .eyebrow{ font-size:12px;letter-spacing:1.5px;text-transform:uppercase; opacity:0.85; margin-bottom:4px; }
  .header h1{margin:0 0 6px 0;font-size:26px;}
  .header .sub{font-size:13px;opacity:0.92;}
  .badges{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .badge{
    background:rgba(255,255,255,0.22); border:1px solid rgba(255,255,255,0.35);
    border-radius:999px; padding:6px 13px; font-size:12px; display:flex;align-items:center;gap:6px;
  }
  .badge input{
    width:65px;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.6);
    color:#fff;font-size:12px;font-family:inherit;text-align:right;
  }
  .badge input:focus{outline:none;border-bottom:1px solid #fff;}

  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tab{
    border:none;background:var(--bg-card);color:var(--muted); padding:9px 15px;
    border-radius:999px;font-family:'Quicksand',sans-serif; font-weight:700;font-size:13px;
    cursor:pointer;border:1.5px solid var(--border); transition:all .15s ease;
  }
  .tab:hover{border-color:var(--lav);}
  .tab.active{background:var(--lav-dark);color:#fff;border-color:var(--lav-dark);}

  .cat-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .cat-chip{
    padding:5px 12px; border-radius:999px; font-size:11.5px; font-weight:600;
    background:var(--bg-cream); border:1px solid var(--border); color:var(--text); cursor:pointer;
  }
  .cat-chip:hover{border-color:var(--lav-dark);}
  .cat-chip.active{background:var(--lav-dark); color:#fff; border-color:var(--lav-dark);}

  .card{ background:var(--bg-card); border:1px solid var(--border); border-radius:18px; padding:18px 20px; margin-bottom:16px; }
  .card h2{margin:0 0 4px 0;font-size:16.5px;}
  .card .hint{color:var(--muted);font-size:12px;margin:0 0 14px 0;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{ text-align:left;color:var(--muted);font-weight:600;font-size:11px; text-transform:uppercase;letter-spacing:.4px; padding:8px 6px;border-bottom:1.5px solid var(--border); }
  td{padding:8px 6px;border-bottom:1.5px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}

  .pill{border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:600;display:inline-block;}
  .pill.ok{background:var(--success-bg);color:var(--success);}
  .pill.low{background:var(--warn-bg);color:var(--warn);}
  .pill.out{background:var(--danger-bg);color:var(--danger);}
  .pill.cat{background:var(--lav-pale);color:var(--lav-dark);border:1px solid var(--lav);}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px;}
  .field label{font-size:11px;color:var(--muted);font-weight:600;}
  .field input,.field select{
    padding:8px 10px;border-radius:10px;border:1.5px solid var(--border);
    font-family:inherit;font-size:12.5px;background:var(--bg-cream);color:var(--text);
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--lav);}

  .tbl-input{
    width:100%; padding:4px 6px; border:1px solid var(--border); border-radius:6px;
    background:var(--bg-cream); font-family:inherit; font-size:12px; color:var(--text);
  }
  .tbl-input.num-in{ text-align:right; width:60px; }
  .tbl-input:focus{ outline:none; border-color:var(--lav-dark); background:#fff; }

  .btn{ background:var(--lav-dark);color:#fff;border:none;border-radius:10px; padding:9px 16px;font-family:'Quicksand',sans-serif;font-weight:700; font-size:13px;cursor:pointer; }
  .btn:hover{background:#7C5CAC;}
  .btn.ghost{background:transparent;color:var(--lav-dark);border:1.5px solid var(--lav);}
  .btn.ghost:hover{background:var(--lav-pale);}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#C2607A;}
  .btn.sm{padding:5px 10px;font-size:11.5px;}

  .empty{ text-align:center;color:var(--muted);padding:28px 10px;font-size:13px; }
  .icon-btn{ background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:2px 5px; }
  .icon-btn:hover{color:var(--danger);}

  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:6px;}
  .stat{background:var(--bg-cream);border-radius:14px;padding:12px 14px;}
  .stat .label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600;}
  .stat .value{font-family:'Quicksand',sans-serif;font-weight:700;font-size:18px;margin-top:3px;}
  .stat.profit .value.pos{color:var(--success);}
  .stat.profit .value.neg{color:var(--danger);}

  .loading{text-align:center;padding:60px 0;color:var(--muted);font-size:14px;}
  .msg{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .search-box{
    width:100%; margin-bottom:10px; padding:10px 14px; border-radius:12px;
    border:2px solid var(--lav); font-family:inherit; font-size:13.5px; background:#fff;
  }

  .audit-card{
    background:var(--bg-cream); border:1.5px solid var(--border); border-radius:14px;

  .audit-btn{

    font-size:20px; font-weight:bold; cursor:pointer; display:inline-flex; justify-content:center; align-items:center;
  }
  .audit-btn:active{ background:#7C5CAC; }
</style>

function loadState(){
  try{
    const loaded = localStorage.getItem(STORE_KEY);
    if(loaded){
      const parsed = JSON.parse(loaded);
      state = Object.assign(state, parsed);
      if(!state.categories || state.categories.length === 0){ state.categories = DEFAULT_CATEGORIES; }
      if(!state.products || state.products.length === 0){ state.products = EXCEL_PRODUCTS; }
      if(!state.monthlyRent){ state.monthlyRent = { '2026-08': 140 }; }
      if(!state.pnlAdjustments){ state.pnlAdjustments = []; }
      state.products.forEach(p=>{
        if(!p.category) p.category = 'Accessories & Others';
        if(p.stockHome === undefined) p.stockHome = 0;
        if(p.stockLocker === undefined) p.stockLocker = 0;
      });
    }
  }catch(e){}
  render();
}

function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(n){ return (Math.round(n*100)/100).toFixed(2); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function setTab(t){ state.activeTab = t; render(); }

// ---------- DATA BACKUP & RESTORE ----------
function exportBackupJSON(){
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
  const dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", `Twirlbykco_Backup_${new Date().toISOString().slice(0,10)}.json`);
  document.body.appendChild(dlAnchor);
  dlAnchor.click();
  dlAnchor.remove();
}

function importBackupJSON(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const imported = JSON.parse(e.target.result);
      if(imported && imported.products){
        state = Object.assign(state, imported);
        saveState();
        render();
        alert('🎉 Backup restored successfully!');
      } else {
        alert('Invalid backup file structure.');
      }
    }catch(err){
      alert('Error reading backup file: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function addProduct(){
  try{
    const nameEl = document.getElementById('np-name');
    const skuEl = document.getElementById('np-sku');
    const catEl = document.getElementById('np-cat');
    const costEl = document.getElementById('np-cost');
    const toyEl = document.getElementById('np-priceToy');
    const shopeeEl = document.getElementById('np-priceShopee');
    const directEl = document.getElementById('np-priceDirect');
    const homeEl = document.getElementById('np-stockHome');
    const lockerEl = document.getElementById('np-stockLocker');
    const lowEl = document.getElementById('np-low');

    const name = nameEl ? nameEl.value.trim() : '';
    if(!name){
      alert('Please enter a Product Description / Name!');
      if(nameEl) nameEl.focus();
      return;
    }

    const sku = (skuEl && skuEl.value.trim()) ? skuEl.value.trim() : ('NP-' + Math.floor(100 + Math.random()*899));
    const category = catEl ? catEl.value : 'Accessories & Others';
    const cost = parseFloat(costEl ? costEl.value : 0) || 1.50;
    const priceToy = parseFloat(toyEl ? toyEl.value : 0) || 7.90;
    const priceShopee = parseFloat(shopeeEl ? shopeeEl.value : 0) || priceToy;
    const priceDirect = parseFloat(directEl ? directEl.value : 0) || (priceToy - 2.00);
    const stockHome = parseInt(homeEl ? homeEl.value : 0) || 0;
    const stockLocker = parseInt(lockerEl ? lockerEl.value : 0) || 0;
    const lowThreshold = parseInt(lowEl ? lowEl.value : 0) || 3;

    const newP = {
      id: uid(), sku, name, category, cost, priceToy, priceShopee, priceDirect,
      stockHome, stockLocker, lowThreshold
    };

    state.products.unshift(newP);
    saveState();
    render();
    alert(`🎉 Successfully added product "${name}" (${sku}) to catalog!`);
  } catch(err){
    console.error('Error in addProduct:', err);
    alert('An unexpected error occurred while adding the product: ' + err.message);
  }
}

function adjustAuditCount(id, delta){
  if(state.auditDraft[id] === undefined){
    const p = state.products.find(p=>p.id===id);
    state.auditDraft[id] = p ? p.stockLocker : 0;
  }
  state.auditDraft[id] = Math.max(0, state.auditDraft[id] + delta);
  render();
}

function saveAuditState(){
  state.products.forEach(p=>{
    if(state.auditDraft[p.id] !== undefined){
      p.stockLocker = state.auditDraft[p.id];
    }
  });
  saveState();
  render();
  alert('✅ Locker Audit synced successfully to Master Inventory!');
}

  const inputEl = document.getElementById(`pq-printqty-${productId}`);
  const qtyPrinted = parseInt(inputEl?.value) || 0;
  if(!p || qtyPrinted<=0) return;

  p.stockHome += qtyPrinted;

function quickTransferToLocker(productId, qty){
  const p = state.products.find(p=>p.id===productId);
  if(!p || qty<=0) return;
  if(p.stockHome < qty && !confirm(`Home Stock has ${p.stockHome}. Transfer ${qty} to locker anyway?`)){
    return;
  }
  p.stockHome = Math.max(0, p.stockHome - qty);
  p.stockLocker += qty;

  state.movements.unshift({
    id: uid(), date: new Date().toISOString().slice(0,10),
    type: 'restock', productId: p.id, qty, unitPrice: p.priceToy, note: 'Quick transfer from Print Queue'
  });

  saveState(); render();
}

// ---------- ORDERS & SHOPEE FEE LOGGING ----------
function autoFillOrderPrice(){
  const pid = document.getElementById('ord-product').value;
  const channel = document.getElementById('ord-channel').value;
  const discPct = parseFloat(document.getElementById('ord-disc').value) || 0;
  const p = state.products.find(p=>p.id===pid);
  if(!p) return;

  let origPrice = p.priceDirect;
  if(channel==='Shopee') origPrice = p.priceShopee;
  if(channel==='Toy Outpost') origPrice = p.priceToy;

  const discountedPrice = origPrice * (1 - (discPct / 100));
  document.getElementById('ord-price').value = fmt(discountedPrice);

  const dateYear = new Date().getFullYear();
  let prefix = 'KCO';
  if(channel === 'Shopee') prefix = 'SHP';
  if(channel === 'Toy Outpost') prefix = 'TOY';
  
  const randNum = Math.floor(1000 + Math.random()*8999);
  document.getElementById('ord-no-preview').value = `${prefix}-${dateYear}-${randNum}`;

  const shopeeBox = document.getElementById('shopee-fee-box');
  if(shopeeBox){
    shopeeBox.style.display = (channel === 'Shopee') ? 'flex' : 'none';
  }
  calculateShopeeNetPayout();
}

function calculateShopeeNetPayout(){
  const qty = parseInt(document.getElementById('ord-qty').value) || 1;
  const unitPrice = parseFloat(document.getElementById('ord-price').value) || 0;
  const shopeeFeePct = parseFloat(document.getElementById('ord-shopee-feepct')?.value) || 13;
  const shopeeShipping = parseFloat(document.getElementById('ord-shopee-shipping')?.value) || 0;

  const grossTotal = unitPrice * qty;
  const feeAmt = grossTotal * (shopeeFeePct / 100);
  const netPayout = grossTotal - feeAmt - shopeeShipping;

  const netEl = document.getElementById('ord-shopee-netpayout');
  if(netEl){
    netEl.value = fmt(netPayout);
  }
}

function addOrder(){
  const date = document.getElementById('ord-date').value || new Date().toISOString().slice(0,10);
  const customer = document.getElementById('ord-customer').value.trim();
  const channel = document.getElementById('ord-channel').value;
  const productId = document.getElementById('ord-product').value;
  const qty = parseInt(document.getElementById('ord-qty').value) || 1;
  const discPct = parseFloat(document.getElementById('ord-disc').value) || 0;
  const details = document.getElementById('ord-details').value.trim();
  const priceInput = parseFloat(document.getElementById('ord-price').value);
  const payment = document.getElementById('ord-pay').value;
  const status = document.getElementById('ord-status').value;
  const orderNo = document.getElementById('ord-no-preview').value;

  const p = state.products.find(p=>p.id===productId);
  let origPrice = p ? p.priceDirect : 0;
  if(channel==='Shopee' && p) origPrice = p.priceShopee;
  if(channel==='Toy Outpost' && p) origPrice = p.priceToy;

  const unitPrice = isNaN(priceInput) ? (origPrice * (1 - (discPct/100))) : priceInput;
  const totalPrice = unitPrice * qty;

  if(p && channel !== 'Toy Outpost'){
    p.stockHome = Math.max(0, p.stockHome - qty);
  }

  let shopeeFeeAmt = 0;
  let shopeeShippingAmt = 0;
  if(channel === 'Shopee'){
    const shopeeFeePct = parseFloat(document.getElementById('ord-shopee-feepct')?.value) || 13;
    shopeeShippingAmt = parseFloat(document.getElementById('ord-shopee-shipping')?.value) || 0;
    shopeeFeeAmt = totalPrice * (shopeeFeePct / 100);

    const totalShopeeDeductions = shopeeFeeAmt + shopeeShippingAmt;
    if(totalShopeeDeductions > 0){
      state.expenses.unshift({
        id: `exp_shopee_${orderNo}`,
        date,
        item: `Shopee Platform & Shipping Fees (${orderNo})`,
        vendor: 'Shopee',
        curr: 'SGD',
        rawCost: totalShopeeDeductions,
        costSgd: totalShopeeDeductions
      });
    }
  }

  state.orders.unshift({
    id: uid(), orderNo: orderNo || ('KCO-' + Math.floor(1000 + Math.random()*8999)),
    date, customer: customer || channel, channel, productId, qty, discPct, details, unitPrice, totalPrice, 
    shopeeFeeAmt, shopeeShippingAmt, nettReceived: totalPrice - shopeeFeeAmt - shopeeShippingAmt, payment, status
  });

  saveState(); render();
}

function deleteOrder(id){
  if(!confirm('Delete this order entry?')) return;
  const o = state.orders.find(ord=>ord.id===id);
  if(o && o.orderNo){
    state.expenses = state.expenses.filter(e => e.id !== `exp_shopee_${o.orderNo}`);
  }
  state.orders = state.orders.filter(o=>o.id!==id);
  saveState(); render();
}

function calculatePrintCost(){
  const grams = parseFloat(document.getElementById('calc-grams').value) || 0;
  const filCostPerKg = parseFloat(document.getElementById('calc-filcost').value) || 21.45;
  const hours = parseFloat(document.getElementById('calc-hours').value) || 0;
  const watts = parseFloat(document.getElementById('calc-watts').value) || 150;
  const accCost = parseFloat(document.getElementById('calc-acc').value) || 0.55;
  const packCost = parseFloat(document.getElementById('calc-pack').value) || 0.40;
  const markupPct = parseFloat(document.getElementById('calc-markup').value) || 150;

  const matCost = (grams / 1000) * filCostPerKg;
  const kWh = (watts / 1000) * hours;
  const powerCost = kWh * state.sgElectricityRate;

  const totalCost = matCost + powerCost + accCost + packCost;
  const suggestedPrice = totalCost * (1 + markupPct / 100);
  const profit = suggestedPrice - totalCost;

  document.getElementById('calc-res-mat').innerText = '$' + fmt(matCost);
  document.getElementById('calc-res-power').innerText = '$' + fmt(powerCost);
  document.getElementById('calc-res-total').innerText = '$' + fmt(totalCost);
  document.getElementById('calc-res-price').innerText = '$' + fmt(suggestedPrice);
  document.getElementById('calc-res-profit').innerText = '$' + fmt(profit);
}

function calculateCostSandbox(){
  const grams = parseFloat(document.getElementById('sb-grams').value) || 0;
  const filPriceKg = parseFloat(document.getElementById('sb-filcost').value) || 21.45;
  const wasteCost = parseFloat(document.getElementById('sb-waste').value) || 0.20;
  const accCost = parseFloat(document.getElementById('sb-acc').value) || 0.55;
  const packCost = parseFloat(document.getElementById('sb-pack').value) || 0.40;
  const elecCost = parseFloat(document.getElementById('sb-elec').value) || 0.05;

  const filCost = (grams / 1000) * filPriceKg;
  const totalUnitCost = filCost + wasteCost + accCost + packCost + elecCost;

  document.getElementById('sb-res-fil').innerText = '$' + fmt(filCost);
  document.getElementById('sb-res-waste').innerText = '$' + fmt(wasteCost);
  document.getElementById('sb-res-acc').innerText = '$' + fmt(accCost);
  document.getElementById('sb-res-pack').innerText = '$' + fmt(packCost);
  document.getElementById('sb-res-elec').innerText = '$' + fmt(elecCost);
  document.getElementById('sb-res-unitcost').innerText = '$' + fmt(totalUnitCost);
}

function renderAudit(){
  const lockerOnlyProducts = state.products.filter(p => p.stockLocker > 0);

  const rows = lockerOnlyProducts.map(p=>{
    const cnt = state.auditDraft[p.id] !== undefined ? state.auditDraft[p.id] : p.stockLocker;

    let diffPill = `<span class="pill ok">Match</span>`;

    if(diff < 0) diffPill = `<span class="pill out">${diff}</span>`;

    return `
    <div class="audit-card">
      <div>
        <b>${esc(p.name)}</b>
        <div class="msg">SKU: ${esc(p.sku)} | Category: ${esc(p.category)} | Expected: ${p.stockLocker} ${diffPill}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="audit-btn" onclick="adjustAuditCount('${p.id}', -1)">−</button>
        <span style="font-size:18px;font-weight:bold;width:30px;text-align:center">${cnt}</span>
        <button class="audit-btn" onclick="adjustAuditCount('${p.id}', 1)">+</button>
      </div>
    </div>`;

  return `
  <div class="card">

  </div>`;
}

function renderSummary(){
  const year = state.pnlYear;
  const month = state.pnlMonth;

  // Filter Orders
  const filteredOrders = state.orders.filter(o=>{
    if(o.payment==='Gift') return false;
    const y = o.date.slice(0,4);
    const m = o.date.slice(5,7);
    return (year === 'All' || y === year) && (month === 'All' || m === month);
  });

  // Filter Expenses
  const filteredExpenses = state.expenses.filter(e=>{
    const y = e.date.slice(0,4);
    const m = e.date.slice(5,7);
    return (year === 'All' || y === year) && (month === 'All' || m === month);
  });

  // Filter Locker Movements
  const lockerSales = state.movements.filter(m=>{
    if(m.type !== 'sale') return false;
    const y = m.date.slice(0,4);
    const mth = m.date.slice(5,7);
    return (year === 'All' || y === year) && (month === 'All' || mth === month);
  });

  // Channel Revenue Breakdowns
  const grossLocker = lockerSales.reduce((s,m)=>s + m.qty*m.unitPrice, 0);
  const lockerFee = grossLocker * (state.locker.feePct/100);
  const netLocker = grossLocker - lockerFee;

  const shopeeOrders = filteredOrders.filter(o => o.channel === 'Shopee' || (o.orderNo && o.orderNo.startsWith('SHP')));
  const directOrders = filteredOrders.filter(o => o.channel !== 'Shopee' && (!o.orderNo || !o.orderNo.startsWith('SHP')));

  const grossShopee = shopeeOrders.reduce((s,o)=>s + (o.totalPrice || o.qty * o.unitPrice), 0);
  const shopeeFeesTotal = shopeeOrders.reduce((s,o)=>s + (o.shopeeFeeAmt || 0) + (o.shopeeShippingAmt || 0), 0);

  const grossDirect = directOrders.reduce((s,o)=>s + (o.totalPrice || o.qty * o.unitPrice), 0);

  const totalGrossRevenue = grossLocker + grossShopee + grossDirect;
  const totalOperatingExp = filteredExpenses.reduce((s,e)=>s + e.costSgd, 0);

  let monthKey = (year !== 'All' && month !== 'All') ? `${year}-${month}` : '2026-08';
  const monthRentVal = state.monthlyRent[monthKey] !== undefined ? state.monthlyRent[monthKey] : 140;

  const filteredAdj = state.pnlAdjustments.filter(a=>{
    const y = a.date.slice(0,4);
    const m = a.date.slice(5,7);
    return (year === 'All' || y === year) && (month === 'All' || m === month);
  });
  const totalPnlAdj = filteredAdj.reduce((s,a)=>s + a.amount, 0);

  const netProfit = (totalGrossRevenue - lockerFee) - monthRentVal - totalOperatingExp + totalPnlAdj;

  const mummyShare = Math.max(0, netProfit * 0.50);
  const klarissaShare = Math.max(0, netProfit * 0.20);
  const daddyShare = Math.max(0, netProfit * 0.20);
  const khylerShare = Math.max(0, netProfit * 0.10);

  const adjRows = state.pnlAdjustments.map(a=>`<tr>
    <td>${a.date}</td>
    <td>${esc(a.note)}</td>
    <td class="num"><b>${a.amount >= 0 ? '+$'+fmt(a.amount) : '−$'+fmt(Math.abs(a.amount))}</b></td>
    <td><button class="icon-btn" onclick="deletePnlAdjustment('${a.id}')">✕</button></td>
  </tr>`).join('');

  return `
  <div class="card">
    <h2>📊 P&amp;L Financial Dashboard</h2>
    <div class="row" style="max-width:580px;margin-bottom:14px">
      <div class="field"><label>Filter Year</label>
        <select onchange="state.pnlYear=this.value; render();">
          <option value="All" ${year==='All'?'selected':''}>All Years</option>
          <option value="2026" ${year==='2026'?'selected':''}>2026</option>
        </select>
      </div>
      <div class="field"><label>Filter Month</label>
        <select onchange="state.pnlMonth=this.value; render();">
          <option value="All" ${month==='All'?'selected':''}>All Months</option>
          <option value="08" ${month==='08'?'selected':''}>08 - Aug</option>
          <option value="09" ${month==='09'?'selected':''}>09 - Sep</option>
          <option value="10" ${month==='10'?'selected':''}>10 - Oct</option>
          <option value="11" ${month==='11'?'selected':''}>11 - Nov</option>
          <option value="12" ${month==='12'?'selected':''}>12 - Dec</option>
        </select>
      </div>
      <div class="field"><label>Monthly Locker Rent ($)</label>
        <input type="number" value="${monthRentVal}" onchange="updateMonthlyRent('${monthKey}', this.value)">
      </div>
    </div>

    <div class="summary-grid">
      <div class="stat"><div class="label">Gross Revenue</div><div class="value">$${fmt(totalGrossRevenue)}</div></div>
      <div class="stat"><div class="label">Consignment Fee (${state.locker.feePct}%)</div><div class="value">−$${fmt(lockerFee)}</div></div>
      <div class="stat"><div class="label">Operating Expenses</div><div class="value">−$${fmt(totalOperatingExp)}</div></div>
      <div class="stat"><div class="label">Locker Rent (${monthKey})</div><div class="value">−$${fmt(monthRentVal)}</div></div>
      <div class="stat"><div class="label">P&amp;L Adjustments</div><div class="value">${totalPnlAdj>=0 ? '+$'+fmt(totalPnlAdj) : '−$'+fmt(Math.abs(totalPnlAdj))}</div></div>
      <div class="stat profit"><div class="label">Actual Net Profit</div><div class="value ${netProfit>=0?'pos':'neg'}">$${fmt(netProfit)}</div></div>
    </div>
  </div>

  <div class="card">
    <h2>🏪 Multi-Channel Sales Performance Summary</h2>
    <p class="hint">Compares performance across Toy Outpost Suntec Locker, Shopee, and Direct/IG Sales to inform channel expansion or ad spend.</p>
    <table>
      <tr><th>Sales Channel</th><th class="num">Orders / Sales</th><th class="num">Gross Revenue</th><th class="num">Channel Fees</th><th class="num">Net Revenue</th></tr>
      <tr>
        <td><b>Toy Outpost Suntec Locker</b></td>
        <td class="num">${lockerSales.length} sales</td>
        <td class="num">$${fmt(grossLocker)}</td>
        <td class="num">−$${fmt(lockerFee)} (${state.locker.feePct}%)</td>
        <td class="num"><b>$${fmt(netLocker)}</b></td>
      </tr>
      <tr>
        <td><b>Shopee Store</b></td>
        <td class="num">${shopeeOrders.length} orders</td>
        <td class="num">$${fmt(grossShopee)}</td>
        <td class="num">−$${fmt(shopeeFeesTotal)}</td>
        <td class="num"><b>$${fmt(grossShopee - shopeeFeesTotal)}</b></td>
      </tr>
      <tr>
        <td><b>Direct / IG Sales</b></td>
        <td class="num">${directOrders.length} orders</td>
        <td class="num">$${fmt(grossDirect)}</td>
        <td class="num">$0.00</td>
        <td class="num"><b>$${fmt(grossDirect)}</b></td>
      </tr>
      <tr style="font-weight:bold;background:var(--bg-cream)">
        <td>TOTAL REVENUE</td>
        <td class="num">${lockerSales.length + filteredOrders.length} sales</td>
        <td class="num">$${fmt(totalGrossRevenue)}</td>
        <td class="num">−$${fmt(lockerFee + shopeeFeesTotal)}</td>
        <td class="num">$${fmt(totalGrossRevenue - lockerFee - shopeeFeesTotal)}</td>
      </tr>
    </table>
  </div>

  <div class="card">
    <h2>✏️ Manual P&amp;L Adjustment / Correction</h2>
    <p class="hint">Type an amount (e.g. +50 or -20) to manually adjust calculated profit for a month.</p>
    <div class="row">
      <div class="field"><label>Date</label><input id="pnl-adj-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field" style="flex:2"><label>Adjustment Note / Reason</label><input id="pnl-adj-note" placeholder="e.g. Unrecorded cash payout or promo correction"></div>
      <div class="field"><label>Adjustment Amount ($)</label><input id="pnl-adj-amt" type="number" step="0.01" placeholder="+50 or -20"></div>
      <button class="btn" onclick="addPnlAdjustment()">Add Adjustment</button>
    </div>
    ${state.pnlAdjustments.length > 0 ? `<table style="margin-top:12px"><tr><th>Date</th><th>Note</th><th class="num">Amount</th><th></th></tr>${adjRows}</table>` : ''}
  </div>

  <div class="card">
    <h2>Profit Sharing Breakdown (AKSK)</h2>
    <div class="summary-grid">
      <div class="stat"><div class="label">A (50%)</div><div class="value">$${fmt(mummyShare)}</div></div>
      <div class="stat"><div class="label">K (20%)</div><div class="value">$${fmt(klarissaShare)}</div></div>
      <div class="stat"><div class="label">S (20%)</div><div class="value">$${fmt(daddyShare)}</div></div>
      <div class="stat"><div class="label">K (10%)</div><div class="value">$${fmt(khylerShare)}</div></div>
    </div>
  </div>`;
}

function renderPrintQueue(){

  const needPrintAll = state.products.filter(p=>p.stockLocker < p.lowThreshold && p.stockHome < p.lowThreshold);
  const needRestockAll = state.products.filter(p=>p.stockLocker < p.lowThreshold && p.stockHome >= p.lowThreshold);

  const needPrintList = needPrintAll.filter(p=> cat === 'All' || p.category === cat);
  const needRestockList = needRestockAll.filter(p=> cat === 'All' || p.category === cat);

  const catChips = ['All', ...state.categories].map(c=>{
    const cntP = needPrintAll.filter(p=> c==='All' || p.category===c).length;
    const cntR = needRestockAll.filter(p=> c==='All' || p.category===c).length;
    const totalCount = cntP + cntR;
    return `
      <span class="cat-chip ${state.queueCategory===c?'active':''}" onclick="state.queueCategory='${c}'; render();">
        ${esc(c)} (${totalCount})
      </span>
    `;

  const totalHomeVal = state.products.reduce((s,p)=>s+p.stockHome*p.cost,0);

  const printRows = needPrintList.map(p=>{

    return `<tr>

      <td><span class="pill cat">${esc(p.category||'General')}</span></td>

      <td class="num">
        <input id="pq-printqty-${p.id}" class="tbl-input num-in" style="width:70px;font-weight:bold;color:var(--lav-dark)" type="number" value="${defaultPrintQty}"> pcs

      <td><b>${esc(p.name)}</b><div class="msg">SKU: ${esc(p.sku)}</div></td>

      <div class="stat"><div class="label">Total Home Inventory Cost</div><div class="value">$${fmt(totalHomeVal)}</div></div>
      <div class="stat"><div class="label">Total Locker Inventory Cost</div><div class="value">$${fmt(totalLockerVal)}</div></div>

    <p class="hint">Click a category pill below to view low-stock print jobs for that specific brand line.</p>

    <h2>🖨️ Action Required: Turn On 3D Printer (${needPrintList.length} Items in ${esc(cat)})</h2>

    ${needPrintList.length===0 ? `<div class="empty">🎉 All items in category "${esc(cat)}" are sufficiently stocked at Home! No urgent prints needed.</div>` : `
    <table>
      <tr><th>Product Name</th><th>Category</th><th class="num">Locker Stock</th><th class="num">Home Stock</th><th class="num">Quantity to Print</th><th>Action</th></tr>
      ${printRows}

        <th style="width:80px">SKU</th>
        <th>Product Description</th>
        <th style="width:135px">Category</th>

        <th class="num" style="width:70px">Shopee $</th>
        <th class="num" style="width:70px">Direct $</th>
        <th class="num" style="width:130px">Home Stock</th>
        <th class="num" style="width:130px">Suntec Locker</th>

function renderOrders(){
  const dateYear = new Date().getFullYear();
  const randNum = Math.floor(1000 + Math.random()*8999);
  const defaultOrderNo = `KCO-${dateYear}-${randNum}`;

  const prodOptions = state.products.map(p=>`<option value="${p.id}">${esc(p.name)} [${esc(p.category||'Gen')}] (Home: ${p.stockHome})</option>`).join('');
  const rows = state.orders.map(o=>{
    const p = state.products.find(p=>p.id===o.productId);
    const tot = o.totalPrice || (o.qty * o.unitPrice);
    const discLabel = o.discPct > 0 ? `<span class="pill low">-${o.discPct}%</span>` : '';
    const shopeePill = o.shopeeFeeAmt > 0 ? `<div class="msg" style="color:var(--danger)">Shopee Fees &amp; Shipping: −$${fmt(o.shopeeFeeAmt + (o.shopeeShippingAmt||0))}</div>` : '';
    
    return `<tr>
      <td><b>${o.orderNo}</b><br><span style="font-size:10.5px;color:var(--muted)">${o.date}</span></td>
      <td>${esc(o.customer)} <div class="msg">Channel: ${o.channel||'Direct'}</div></td>
      <td>${p ? esc(p.name) : esc(o.productId)} <span class="pill cat">${p ? esc(p.category) : 'Order'}</span> ${discLabel}<div class="msg">${esc(o.details||'')}</div></td>
      <td class="num">${o.qty}</td>
      <td class="num">$${fmt(o.unitPrice)}</td>
      <td class="num"><b>$${fmt(tot)}</b>${shopeePill}</td>
      <td>${o.payment}</td>
      <td>${o.status}</td>
      <td><button class="icon-btn" onclick="deleteOrder('${o.id}')">✕</button></td>
    </tr>`;
  }).join('');

  return `
  <div class="card">
    <h2>Log Direct / Shopee / Custom Order</h2>
    <div class="row">
      <div class="field"><label>Date</label><input id="ord-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Channel</label>
        <select id="ord-channel" onchange="autoFillOrderPrice()">
          <option value="Direct / IG">Direct / IG (KCO-)</option>
          <option value="Shopee">Shopee (SHP-)</option>
          <option value="Toy Outpost">Toy Outpost (TOY-)</option>
        </select>
      </div>
      <div class="field"><label>Order # (Auto)</label><input id="ord-no-preview" value="${defaultOrderNo}" readonly style="font-weight:bold;color:var(--lav-dark)"></div>
      <div class="field"><label>Customer Name</label><input id="ord-customer" placeholder="e.g. Clara / Eileen"></div>
      <div class="field" style="flex:1.5"><label>Product</label><select id="ord-product" onchange="autoFillOrderPrice()">${prodOptions}</select></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="field"><label>Qty</label><input id="ord-qty" type="number" value="1" oninput="calculateShopeeNetPayout()"></div>
      <div class="field"><label>Discount (%)</label>
        <select id="ord-disc" onchange="autoFillOrderPrice()">
          <option value="0">0% (Standard Price)</option>
          <option value="5">5% Off</option>
          <option value="10">10% Off</option>
          <option value="15">15% Off</option>
          <option value="20">20% Off</option>
          <option value="25">25% Off</option>
          <option value="30">30% Off</option>
          <option value="50">50% Off</option>
        </select>
      </div>
      <div class="field"><label>Final Price/Item ($)</label><input id="ord-price" placeholder="Auto-calculated" oninput="calculateShopeeNetPayout()"></div>
      <div class="field" style="flex:2"><label>Details (Names / Character / Colors)</label><input id="ord-details" placeholder="e.g. Thad | Panda | Black Gi"></div>
      <div class="field"><label>Payment</label><select id="ord-pay"><option value="Paid">Paid</option><option value="Pending">Pending</option></select></div>
      <div class="field"><label>Status</label><select id="ord-status"><option value="Delivered">Delivered</option><option value="Printed">Printed</option></select></div>
    </div>

    <!-- SHOPEE AUTOMATED FEE LOGGING BOX -->
    <div id="shopee-fee-box" class="row" style="margin-top:12px;padding:12px 14px;background:var(--bg-cream);border-radius:12px;border:1.5px dashed var(--lav);display:none">
      <div class="field"><label>Shopee Platform Fee (%)</label><input id="ord-shopee-feepct" type="number" value="13" oninput="calculateShopeeNetPayout()"></div>
      <div class="field"><label>Shopee Shipping Charged ($)</label><input id="ord-shopee-shipping" type="number" step="0.01" value="0.00" oninput="calculateShopeeNetPayout()"></div>
      <div class="field"><label>Estimated Shopee Net Payout ($)</label><input id="ord-shopee-netpayout" readonly style="font-weight:bold;color:var(--success)"></div>
      <div style="font-size:11.5px;color:var(--muted);width:100%;margin-top:4px">💡 Shopee fees and shipping charges will be automatically logged to your <b>Expenses</b> tab upon saving this order.</div>
    </div>

    <div class="row" style="margin-top:12px">
      <button class="btn" onclick="addOrder()">Add Order</button>
    </div>
  </div>

  <div class="card">
    <h2>Order History (${state.orders.length} Orders Displayed)</h2>
    ${state.orders.length===0 ? `<div class="empty">No new orders logged yet. Use the form above to add your first order starting tomorrow!</div>` : `
    <table>
      <tr><th>Order #</th><th>Customer / Channel</th><th>Product / Category</th><th class="num">Qty</th><th class="num">Final Price</th><th class="num">Total</th><th>Payment</th><th>Status</th><th></th></tr>
      ${rows}
    </table>`}
  </div>`;
}

function renderLog(){
  const options = state.products.map(p=>`<option value="${p.id}">${esc(p.name)} (Home: ${p.stockHome} | Locker: ${p.stockLocker})</option>`).join('');
  const rows = state.movements.map(m=>{
    const p = state.products.find(p=>p.id===m.productId);
    const label = {sale:'🛍️ Locker Sale', restock:'🔄 Restock (Home→Locker)', adjustment:'⚠️ Shrinkage/Damage'}[m.type];
    return `<tr>
      <td>${m.date}</td>
      <td>${label}</td>
      <td>${p ? esc(p.name) : '(Deleted)'}</td>
      <td class="num">${m.qty}</td>
      <td class="num">${m.type==='sale' ? '$'+fmt(m.qty*m.unitPrice) : '—'}</td>
      <td>${esc(m.note||'')}</td>
      <td><button class="icon-btn" onclick="deleteMovement('${m.id}')">✕</button></td>
    </tr>`;
  }).join('');

  return `
  <div class="card">
    <h2>Log Toy Outpost Suntec Activity (With Home Transfer)</h2>
    <div class="row">
      <div class="field" style="flex:2"><label>Product</label><select id="mv-product">${options}</select></div>
      <div class="field"><label>Type</label>
        <select id="mv-type">
          <option value="restock">Locker Restock (Deducts Home -> Adds Locker)</option>
          <option value="sale">Locker Sale (Deducts Locker Stock)</option>
          <option value="adjustment">Shrinkage / Loss (Deducts Locker Stock)</option>
        </select>
      </div>
      <div class="field"><label>Qty</label><input id="mv-qty" type="number" value="1"></div>
      <div class="field"><label>Date</label><input id="mv-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Note</label><input id="mv-note" placeholder="Optional"></div>
      <button class="btn" onclick="logMovement()">Save Log</button>
    </div>
  </div>
  <div class="card">
    <h2>Locker Log History</h2>
    ${state.movements.length===0 ? `<div class="empty">No locker activity recorded yet.</div>` : `
    <table>
      <tr><th>Date</th><th>Type</th><th>Product</th><th class="num">Qty</th><th class="num">Total</th><th>Note</th><th></th></tr>
      ${rows}
    </table>`}
  </div>`;
}

function renderExpenses(){
  const presetOptions = COMMON_EXPENSE_ITEMS.map(i=>`<option value="${esc(i)}">${esc(i)}</option>`).join('');
  const rows = state.expenses.map(e=>`<tr>
    <td>${e.date}</td>
    <td><b>${esc(e.item)}</b></td>
    <td>${esc(e.vendor||'—')}</td>
    <td class="num">${e.curr==='RMB' ? '¥'+fmt(e.rawCost) : '—'}</td>
    <td class="num"><b>$${fmt(e.costSgd)}</b></td>
    <td><button class="icon-btn" onclick="deleteExpense('${e.id}')">✕</button></td>
  </tr>`).join('');

  return `
  <div class="card">
    <h2>Log Operating Expense (RMB Direct Conversion)</h2>
    <div class="row">
      <div class="field"><label>Date</label><input id="exp-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>Vendor</label>
        <select id="exp-vendor">
          <option value="拼多多 (Pinduoduo)">拼多多 (Pinduoduo)</option>
          <option value="淘宝 (Taobao)">淘宝 (Taobao)</option>
          <option value="Aliexpress">Aliexpress</option>
          <option value="Shopee">Shopee</option>
          <option value="Others">Others</option>
        </select>
      </div>
      <div class="field"><label>Preset Item Dropdown</label>
        <select id="exp-preset" onchange="syncPresetExpense()">
          <option value="custom">-- Type Custom or Select Below --</option>
          ${presetOptions}
        </select>
      </div>
      <div class="field" style="flex:1.5"><label>Item Description</label><input id="exp-item" placeholder="e.g. PLA Filament / 51 Hook Chains"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="field"><label>Currency</label>
        <select id="exp-curr" onchange="autoConvertExpenseCost()">
          <option value="RMB">RMB (¥)</option>
          <option value="SGD">SGD ($)</option>
        </select>
      </div>
      <div class="field"><label>Cost in Currency</label><input id="exp-rawcost" type="number" step="0.01" oninput="autoConvertExpenseCost()" placeholder="e.g. 100"></div>
      <div class="field"><label>Converted Cost (SGD)</label><input id="exp-costSgd" type="number" step="0.01" placeholder="Auto-calculated"></div>
      <button class="btn" onclick="addExpense()">Add Expense</button>
    </div>
  </div>

  <div class="card">
    <h2>Expenses History (${state.expenses.length} Expenses Displayed)</h2>
    ${state.expenses.length===0 ? `<div class="empty">No new expenses logged yet. Use the form above to add your first expense starting tomorrow!</div>` : `
    <table>
      <tr><th>Date</th><th>Item Description</th><th>Vendor</th><th class="num">Cost (RMB)</th><th class="num">Cost (SGD)</th><th></th></tr>
      ${rows}
    </table>`}
  </div>`;
}

function renderFilament(){
  const rows = state.filaments.map(f=>{
    let pct = Math.min(100, Math.round((f.weightGrams / 1000) * 100));
    let pillClass = pct > 50 ? 'ok' : (pct > 20 ? 'low' : 'out');
    return `<tr>
      <td><b>${esc(f.brand)}</b></td>
      <td>${esc(f.color)}</td>
      <td>${esc(f.vendor)}</td>
      <td class="num">¥${fmt(f.costRmb)} / $${fmt(f.costSgd)}</td>
      <td class="num">
        <input class="tbl-input num-in" style="width:80px" type="number" value="${f.weightGrams}" onchange="updateFilamentWeight('${f.id}', this.value)"> g
      </td>
      <td><span class="pill ${pillClass}">${pct}% Left</span></td>
      <td><button class="icon-btn" onclick="deleteFilament('${f.id}')">✕</button></td>
    </tr>`;
  }).join('');

  return `
  <div class="card">
    <h2>Track Filament Inventory &amp; Vendors</h2>
    <div class="row">
      <div class="field"><label>Vendor</label>
        <select id="fil-vendor">
          <option value="淘宝 (Taobao)">淘宝 (Taobao)</option>
          <option value="拼多多 (Pinduoduo)">拼多多 (Pinduoduo)</option>
          <option value="Shopee">Shopee</option>
          <option value="Others">Others</option>
        </select>
      </div>
      <div class="field"><label>Brand / Material</label><input id="fil-brand" placeholder="e.g. eSun PLA+"></div>
      <div class="field"><label>Color</label><input id="fil-color" placeholder="e.g. Matte Pastel Blue"></div>
      <div class="field"><label>Spool Cost (RMB ¥)</label><input id="fil-rmb" type="number" step="0.1" placeholder="e.g. 45"></div>
      <div class="field"><label>Spool Cost (SGD $)</label><input id="fil-sgd" type="number" step="0.1" placeholder="Or SGD"></div>
      <div class="field"><label>Remaining (g)</label><input id="fil-weight" type="number" value="1000"></div>
      <button class="btn" onclick="addFilament()">Add Spool</button>
    </div>
  </div>
  <div class="card">
    <h2>Filament Spools Stock</h2>
    <table>
      <tr><th>Brand / Material</th><th>Color</th><th>Vendor</th><th class="num">Cost</th><th class="num">Remaining Weight</th><th>Stock Level</th><th></th></tr>
      ${rows}
    </table>
  </div>`;
}

loadState();
</script>
