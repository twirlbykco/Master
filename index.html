function migrateClickiepalPotInventory(){
  if((state.inventorySchemaVersion||0)>=2) return;
  const legacy=state.products.filter(p=>CLICKIEPAL_POT_SKUS.has(String(p.sku||'').toUpperCase()));
  const legacyById=new Map(legacy.map(p=>[p.id,p]));
  let pooled=state.products.find(p=>p.id===CLICKIEPAL_POT_POOL.id || String(p.sku||'').toUpperCase()==='CPAP');
  if(!pooled){ pooled={...CLICKIEPAL_POT_POOL}; state.products.unshift(pooled); }
  pooled.stockHome=(Number(pooled.stockHome)||0)+legacy.reduce((sum,p)=>sum+(Number(p.stockHome)||0),0);
  pooled.stockLocker=(Number(pooled.stockLocker)||0)+legacy.reduce((sum,p)=>sum+(Number(p.stockLocker)||0),0);
  state.orders.forEach(o=>{const old=legacyById.get(o.productId);if(old){o.details=[old.name.replace(/^ClickiePal\s*/,'').trim(),o.details].filter(Boolean).join(' — ');o.productId=pooled.id;}});
  state.movements.forEach(m=>{const old=legacyById.get(m.productId);if(old){m.note=[old.name.replace(/^ClickiePal\s*/,'').trim(),m.note].filter(Boolean).join(' — ');m.productId=pooled.id;}});
  legacy.forEach(p=>{delete state.auditDraft[p.id];});
  state.products=state.products.filter(p=>!legacyById.has(p.id));
  state.inventorySchemaVersion=2;
}
function loadState(){  try{    const loaded = localStorage.getItem(STORE_KEY);    if(loaded){      const parsed = JSON.parse(loaded);      state = Object.assign(state, parsed);      if(!state.categories || state.categories.length === 0){ state.categories = DEFAULT_CATEGORIES; }      if(!state.products || state.products.length === 0){ state.products = EXCEL_PRODUCTS; }      if(!state.monthlyRent){ state.monthlyRent = { '2026-08': 140 }; }      if(!state.pnlAdjustments){ state.pnlAdjustments = []; }      if(!Array.isArray(state.orderDraft)){ state.orderDraft = []; }      if(!state.orderHeaderDraft){ state.orderHeaderDraft = {}; }      if(!Array.isArray(state.expenseCategories) || !state.expenseCategories.length){ state.expenseCategories = ['Materials','Packaging','Shipping & Delivery','Platform Fees','Equipment & Maintenance','Marketing','Event & Booth Fees','Rent & Utilities','Software & Subscriptions','Professional Services','Other']; }      if(!Array.isArray(state.expenseItems) || !state.expenseItems.length){ state.expenseItems=DEFAULT_EXPENSE_ITEMS.map(i=>({...i})); }      if(!state.expenseFilterCategory) state.expenseFilterCategory='All';      if(state.expenseSearch===undefined) state.expenseSearch='';      if(!state.syncCheckpoints)state.syncCheckpoints={};      if(!state.syncCheckpoints.expenses)state.syncCheckpoints.expenses={throughDate:'',lastRef:'',note:'',updatedAt:''};      if(!state.syncCheckpoints.shopee)state.syncCheckpoints.shopee={throughDate:'',lastRef:'',note:'',updatedAt:''};      if(!Array.isArray(state.syncHistory))state.syncHistory=[];      if(!state.trackerDueDays)state.trackerDueDays=7;      state.expenses.forEach(e=>{ if(!e.category) e.category = e.vendor==='Shopee' ? 'Platform Fees' : 'Other'; });      state.products.forEach(p=>{        if(!p.category) p.category = 'Accessories & Others';        if(p.stockHome === undefined) p.stockHome = 0;        if(p.stockLocker === undefined) p.stockLocker = 0;      });    }    migrateClickiepalPotInventory(); saveState();  }catch(e){}  render();}

function exportBackupJSON(){  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));  const dlAnchor = document.createElement('a');  dlAnchor.setAttribute("href", dataStr);  dlAnchor.setAttribute("download", `Twirlbykco_Backup_${new Date().toISOString().slice(0,10)}.json`);  document.body.appendChild(dlAnchor);  dlAnchor.click();  dlAnchor.remove();}
function importBackupJSON(event){  const file = event.target.files[0];  if(!file) return;  const reader = new FileReader();  reader.onload = function(e){    try{      const imported = JSON.parse(e.target.result);      if(imported && imported.products){        state = Object.assign(state, imported);        migrateClickiepalPotInventory();        saveState();        render();        alert('🎉 Backup restored successfully!');      } else {        alert('Invalid backup file structure.');      }    }catch(err){      alert('Error reading backup file: ' + err.message);    }  };  reader.readAsText(file);}

function addNewCategory(){  const input = document.getElementById('new-cat-name');  const catName = input ? input.value.trim() : '';  if(!catName){ alert('Please type a Category Name!'); return; }  if(state.categories.includes(catName)){    alert('Category already exists!'); return;  }  state.categories.push(catName);  saveState();  if(input) input.value = '';  render();  alert(`🎉 Added new Category: "${catName}"`);}
function resetAllStockToZero(){  if(!confirm('Are you sure you want to RESET ALL STOCK (Home & Locker) to 0 for all items? This lets you start fresh with your physical count.')) return;  state.products.forEach(p=>{    p.stockHome = 0;    p.stockLocker = 0;  });  saveState();  render();  alert('🧹 All inventory stock levels set to 0. You can now enter your exact physical count!');}
function addProduct(){  try{    const nameEl = document.getElementById('np-name');    const skuEl = document.getElementById('np-sku');    const catEl = document.getElementById('np-cat');    const costEl = document.getElementById('np-cost');    const toyEl = document.getElementById('np-priceToy');    const shopeeEl = document.getElementById('np-priceShopee');    const directEl = document.getElementById('np-priceDirect');    const homeEl = document.getElementById('np-stockHome');    const lockerEl = document.getElementById('np-stockLocker');    const lowEl = document.getElementById('np-low');
    const name = nameEl ? nameEl.value.trim() : '';    if(!name){      alert('Please enter a Product Description / Name!');      if(nameEl) nameEl.focus();      return;    }
    const sku = (skuEl && skuEl.value.trim()) ? skuEl.value.trim() : ('NP-' + Math.floor(100 + Math.random()*899));    const category = catEl ? catEl.value : 'Accessories & Others';    const cost = parseFloat(costEl ? costEl.value : 0) || 1.50;    const priceToy = parseFloat(toyEl ? toyEl.value : 0) || 7.90;    const priceShopee = parseFloat(shopeeEl ? shopeeEl.value : 0) || priceToy;    const priceDirect = parseFloat(directEl ? directEl.value : 0) || (priceToy - 2.00);    const stockHome = parseInt(homeEl ? homeEl.value : 0) || 0;    const stockLocker = parseInt(lockerEl ? lockerEl.value : 0) || 0;    const lowThreshold = parseInt(lowEl ? lowEl.value : 0) || 3;
    const newP = {      id: uid(), sku, name, category, cost, priceToy, priceShopee, priceDirect,      stockHome, stockLocker, lowThreshold    };
    state.products.unshift(newP);    saveState();    render();    alert(`🎉 Successfully added product "${name}" (${sku}) to catalog!`);  } catch(err){    console.error('Error in addProduct:', err);    alert('An unexpected error occurred while adding the product: ' + err.message);  }}
function updateProductField(id, field, value){  const p = state.products.find(p=>p.id===id);  if(!p) return;  if(field==='name' || field==='sku' || field==='category') p[field] = value;  else p[field] = parseFloat(value) || 0;  saveState();}
function setQuickStockCount(id, field, value){  const p=state.products.find(p=>p.id===id);  if(!p || !['stockHome','stockLocker'].includes(field)) return;  p[field]=Math.max(0,parseInt(value)||0);  saveState();  render();}
function adjustQuickStock(id, field, delta){  const p=state.products.find(p=>p.id===id);  if(!p || !['stockHome','stockLocker'].includes(field)) return;  p[field]=Math.max(0,(parseInt(p[field])||0)+delta);  saveState();  render();}
function deleteProduct(id){  if(!confirm('Delete product from catalog?')) return;  state.products = state.products.filter(p=>p.id!==id);  saveState(); render();}

function adjustAuditCount(id, delta){  if(state.auditDraft[id] === undefined){    const p = state.products.find(p=>p.id===id);    state.auditDraft[id] = p ? p.stockLocker : 0;  }  state.auditDraft[id] = Math.max(0, state.auditDraft[id] + delta);  render();}
function saveAuditState(){  state.products.forEach(p=>{    if(state.auditDraft[p.id] !== undefined){      p.stockLocker = state.auditDraft[p.id];    }  });  saveState();  render();  alert('✅ Locker Audit synced successfully to Master Inventory!');}
function logCompletedBatch(productId){  const p = state.products.find(p=>p.id===productId);  const inputEl = document.getElementById(`pq-printqty-${productId}`);  const qtyPrinted = parseInt(inputEl?.value) || 0;  if(!p || qtyPrinted<=0) return;

function quickTransferToLocker(productId, qty){  const p = state.products.find(p=>p.id===productId);  if(!p || qty<=0) return;  if(p.stockHome < qty && !confirm(`Home Stock has ${p.stockHome}. Transfer ${qty} to locker anyway?`)){    return;  }  p.stockHome = Math.max(0, p.stockHome - qty);  p.stockLocker += qty;

  if(type==='restock'){    if(p.stockHome < qty && !confirm(`You only have ${p.stockHome} in Home Stock. Restock locker by ${qty} anyway?`)){      return;    }    p.stockHome = Math.max(0, p.stockHome - qty);    p.stockLocker += qty;  } else if(type==='sale' || type==='adjustment'){    p.stockLocker = Math.max(0, p.stockLocker - qty);  }
  state.movements.unshift({ id: uid(), date, type, productId, qty, unitPrice: p.priceToy, note });  saveState(); render();}

function suggestExpenseCategoryName(name){
  const s=String(name||'').toLowerCase();
  const rules=[
    ['Packaging',['packaging','bag','box','label','sticker','backing card','tissue','wrapping']],
    ['Shipping & Delivery',['postage','delivery','courier','shipping','singpost','qxpress']],
    ['Platform Fees',['platform fee','commission','transaction fee','shopee fee']],
    ['Equipment & Maintenance',['printer','nozzle','hotend','build plate','bed sheet','repair','maintenance','removal tool','machine']],
    ['Marketing',['advertising','advertisement','marketing','facebook ad','instagram ad','flyer','banner','photography']],
    ['Event & Booth Fees',['event','booth','fair','bazaar','table rental']],
    ['Rent & Utilities',['rent','electricity','utility','utilities','water','locker rental']],
    ['Software & Subscriptions',['software','subscription','canva','wix','adobe','domain','hosting']],
    ['Professional Services',['accounting','legal','consultant','professional service']],
    ['Materials',['filament','pla','petg','resin','nfc','magnet','keyring','chain','hook','clicker','paracord','heat transfer','glue','paint','hardware']]
  ];
  return (rules.find(([,words])=>words.some(w=>s.includes(w)))||['Other'])[0];
}

  const discountedPrice = origPrice * (1 - (discPct / 100));  document.getElementById('ord-price').value = fmt(discountedPrice);
  const shopeeBox = document.getElementById('shopee-fee-box');  if(shopeeBox){    shopeeBox.style.display = (channel === 'Shopee') ? 'flex' : 'none';  }  calculateShopeeNetPayout();}

  const grossTotal = state.orderDraft.reduce((sum,i)=>sum+i.qty*i.unitPrice,0);  const netPayout = grossTotal - feeAmt - shopeeShipping;

function adjustOrderStock(product,location,delta){ if(!product||!location)return; product[location]=Math.max(0,(Number(product[location])||0)+delta); }
function addOrder(){
  captureOrderHeaderDraft();
  if(!state.orderDraft.length){ alert('Add at least one item to this PO first.'); return; }
  const h=state.orderHeaderDraft;
  const orderNo=h.orderNo || ('KCO-'+new Date().getFullYear()+'-'+Math.floor(1000+Math.random()*8999));
  if(state.orders.some(o=>o.orderNo===orderNo)){ alert('This PO number already exists. Generate a new PO number.'); return; }
  const groupId=uid();
  const gross=state.orderDraft.reduce((sum,i)=>sum+i.qty*i.unitPrice,0);
  const feeAmt=h.channel==='Shopee' ? (Number(h.shopeeFeeAmt)||0) : 0;
  const shipping=h.channel==='Shopee' ? h.shopeeShipping : 0;
  state.orderDraft.forEach((i,index)=>{
    const p=state.products.find(p=>p.id===i.productId);
    const stockLocation=orderStockLocation(h.channel);
    adjustOrderStock(p,stockLocation,-i.qty);
    const itemFee=gross>0 ? feeAmt*((i.qty*i.unitPrice)/gross) : 0;
    const itemShipping=index===0 ? shipping : 0;
    state.orders.unshift({
      id:uid(),groupId,orderNo,date:h.date,customer:h.customer||h.channel,channel:h.channel,
      productId:i.productId,qty:i.qty,discPct:i.discPct,details:i.details,unitPrice:i.unitPrice,
      totalPrice:i.qty*i.unitPrice,shopeeFeeAmt:itemFee,shopeeShippingAmt:itemShipping,
      nettReceived:i.qty*i.unitPrice-itemFee-itemShipping,payment:h.payment,status:h.status,stockLocation,createdAt:new Date().toISOString()
    });
  });
  if(h.channel==='Shopee' && feeAmt+shipping>0) state.expenses.unshift({
    id:'exp_shopee_'+orderNo,date:h.date,category:'Platform Fees',item:'Shopee Platform & Shipping Fees ('+orderNo+')',
    vendor:'Shopee',curr:'SGD',rawCost:feeAmt+shipping,costSgd:feeAmt+shipping,createdAt:new Date().toISOString()
  });
  state.orderDraft=[]; state.orderHeaderDraft={}; saveState(); render(); alert('PO '+orderNo+' saved with all items.');
}

function calculatePrintCost(){  const grams = parseFloat(document.getElementById('calc-grams').value) || 0;  const filCostPerKg = parseFloat(document.getElementById('calc-filcost').value) || 21.45;  const hours = parseFloat(document.getElementById('calc-hours').value) || 0;  const watts = parseFloat(document.getElementById('calc-watts').value) || 150;  const accCost = parseFloat(document.getElementById('calc-acc').value) || 0.55;  const packCost = parseFloat(document.getElementById('calc-pack').value) || 0.40;  const markupPct = parseFloat(document.getElementById('calc-markup').value) || 150;
  const matCost = (grams / 1000) * filCostPerKg;  const kWh = (watts / 1000) * hours;  const powerCost = kWh * state.sgElectricityRate;
  const totalCost = matCost + powerCost + accCost + packCost;  const suggestedPrice = totalCost * (1 + markupPct / 100);  const profit = suggestedPrice - totalCost;
  document.getElementById('calc-res-mat').innerText = '$' + fmt(matCost);  document.getElementById('calc-res-power').innerText = '$' + fmt(powerCost);  document.getElementById('calc-res-total').innerText = '$' + fmt(totalCost);  document.getElementById('calc-res-price').innerText = '$' + fmt(suggestedPrice);  document.getElementById('calc-res-profit').innerText = '$' + fmt(profit);}
function calculateCostSandbox(){  const grams = parseFloat(document.getElementById('sb-grams').value) || 0;  const filPriceKg = parseFloat(document.getElementById('sb-filcost').value) || 21.45;  const wasteCost = parseFloat(document.getElementById('sb-waste').value) || 0.20;  const accCost = parseFloat(document.getElementById('sb-acc').value) || 0.55;  const packCost = parseFloat(document.getElementById('sb-pack').value) || 0.40;  const elecCost = parseFloat(document.getElementById('sb-elec').value) || 0.05;
  const filCost = (grams / 1000) * filPriceKg;  const totalUnitCost = filCost + wasteCost + accCost + packCost + elecCost;
  document.getElementById('sb-res-fil').innerText = '$' + fmt(filCost);  document.getElementById('sb-res-waste').innerText = '$' + fmt(wasteCost);  document.getElementById('sb-res-acc').innerText = '$' + fmt(accCost);  document.getElementById('sb-res-pack').innerText = '$' + fmt(packCost);  document.getElementById('sb-res-elec').innerText = '$' + fmt(elecCost);  document.getElementById('sb-res-unitcost').innerText = '$' + fmt(totalUnitCost);}

function renderHeader(){  return `  <div class="header">    <div class="eyebrow">Twirl by KCO — Production Hub</div>    <h1>Twirlbykco Master hub</h1>    <div class="sub">Editable Monthly Rent | Automated Shopee Fee Logging | Multi-Channel Performance Dashboard</div>    <div class="badges">      <div class="badge">🔑 Locker Fee: <input type="number" value="${state.locker.feePct}" onchange="updateLocker('feePct', this.value)"> %</div>      <div class="badge">💱 1 RMB = $<input type="number" step="0.001" value="${state.cnyRate}" onchange="state.cnyRate=parseFloat(this.value)||0.185; saveState(); render();"> SGD</div>      <div class="badge">⚡ SG Elec: $<input type="number" step="0.0001" value="${state.sgElectricityRate}" onchange="state.sgElectricityRate=parseFloat(this.value)||0.3258; saveState();"> /kWh</div>    </div>  </div>`;}
function renderTabs(){  const activeProducts=state.products.filter(p=>!p.archived);  const needPrint = activeProducts.filter(p=>p.stockLocker < p.lowThreshold && p.stockHome < p.lowThreshold).length;  const needRestock = activeProducts.filter(p=>p.stockLocker < p.lowThreshold && p.stockHome >= p.lowThreshold).length;
  const dueCount=['expenses','shopee'].filter(type=>{const days=trackerDaysOld(state.syncCheckpoints[type]?.throughDate);return days===null||days>state.trackerDueDays;}).length;
  const tabs = [    ['summary', '📊 P&L'],    ['tracker', `✅ Update Tracker${dueCount?' ('+dueCount+')':''}`],    ['quickstock', '⚡ Quick Stock Count'],    ['audit', '📱 Walk Locker Audit'],    ['printqueue', `🛈 Print Queue (${needPrint + needRestock})`],    ['inventory', `📦 Catalog (${activeProducts.length})`],    ['orders', `🛒 Orders (${state.orders.length})`],    ['log', '📝 Locker Activity'],    ['expenses', `💸 Expenses (${state.expenses.length})`],    ['filament', '🧵 Filament Stock'],    ['costformula', '📐 Cost Formulas'],    ['calculator', '⚡ SG Calculator']  ];  return `<div class="tabs">${tabs.map(([id,label])=>    `<button class="tab ${state.activeTab===id?'active':''}" onclick="setTab('${id}')">${label}</button>`  ).join('')}</div>`;}
function renderUpdateTracker(){
  const today=new Date().toISOString().slice(0,10);
  const formatUpdatedAt=value=>{if(!value)return 'Never';const d=new Date(value);return Number.isNaN(d.getTime())?'—':d.toLocaleString('en-SG',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});};
  const shopeeItems=state.orders.filter(o=>o.channel==='Shopee'||String(o.orderNo||'').startsWith('SHP'));
  const shopeeGroups={};shopeeItems.forEach(o=>(shopeeGroups[o.orderNo]||(shopeeGroups[o.orderNo]=[])).push(o));
  const shopeePOs=Object.values(shopeeGroups).map(items=>{
    const first=items[0];
    const gross=items.reduce((sum,o)=>sum+(Number(o.totalPrice)||((Number(o.qty)||0)*(Number(o.unitPrice)||0))),0);
    const fees=items.reduce((sum,o)=>sum+(Number(o.shopeeFeeAmt)||0)+(Number(o.shopeeShippingAmt)||0),0);
    return {orderNo:first.orderNo,date:first.date,payment:first.payment||'Pending',status:first.status||'',gross,fees};
  }).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const now=new Date(),currentKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const monthShopee=shopeePOs.filter(o=>String(o.date||'').slice(0,7)===currentKey);
  const shopeeGross=monthShopee.reduce((s,o)=>s+o.gross,0),shopeeFees=monthShopee.reduce((s,o)=>s+o.fees,0),shopeePending=monthShopee.filter(o=>o.payment==='Pending').reduce((s,o)=>s+o.gross,0);
  const latestExpenses=[...state.expenses].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,8);
  const recordsAfter=type=>{const cp=state.syncCheckpoints[type]||{};if(!cp.throughDate)return type==='expenses'?state.expenses.length:shopeePOs.length;return type==='expenses'?state.expenses.filter(e=>String(e.date||'')>cp.throughDate).length:shopeePOs.filter(o=>String(o.date||'')>cp.throughDate).length;};
  const checkpointCard=(type,title,description)=>{const cp=state.syncCheckpoints[type]||{};const days=trackerDaysOld(cp.throughDate);const due=days===null||days>state.trackerDueDays;const statusClass=days===null?'out':due?'low':'ok';const statusText=days===null?'Not started':due?'Update due':'Up to date';const later=recordsAfter(type);return `<div class="card" style="border-top:4px solid ${due?'var(--warn)':'var(--success)'}"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><div><h2>${title}</h2><p class="hint">${description}</p></div><span class="pill ${statusClass}">${statusText}</span></div><div class="summary-grid"><div class="stat"><div class="label">Updated Through</div><div class="value" style="font-size:16px">${cp.throughDate||'Not set'}</div></div><div class="stat"><div class="label">Last Reference</div><div class="value" style="font-size:14px">${esc(cp.lastRef||'Not set')}</div></div><div class="stat"><div class="label">Checkpoint Saved</div><div class="value" style="font-size:13px">${formatUpdatedAt(cp.updatedAt)}</div></div><div class="stat"><div class="label">Records After Checkpoint</div><div class="value" style="color:${later?'var(--warn)':'var(--success)'}">${later}</div></div></div><div class="row" style="margin-top:14px;padding:12px;background:var(--bg-cream);border-radius:12px"><div class="field"><label>Everything Entered Through</label><input id="tracker-${type}-date" type="date" max="${today}" value="${cp.throughDate||''}"></div><div class="field" style="flex:2"><label>${type==='expenses'?'Last Receipt / Item Entered':'Last Shopee Order Number'}</label><input id="tracker-${type}-ref" value="${esc(cp.lastRef||'')}" placeholder="${type==='expenses'?'e.g. PLA Filament – Taobao':'e.g. SHP-2026-1234'}"></div><div class="field" style="flex:2"><label>Note</label><input id="tracker-${type}-note" value="${esc(cp.note||'')}" placeholder="Optional reminder"></div><button class="btn ghost" onclick="fillTrackerFromLatest('${type}')">Use Latest Recorded</button><button class="btn" onclick="saveTrackerCheckpoint('${type}')">Mark Updated</button></div>${cp.note?`<div class="msg"><b>Saved note:</b> ${esc(cp.note)}</div>`:''}</div>`;};
  const recentShopeeRows=shopeePOs.slice(0,8).map(o=>`<tr><td>${esc(o.date)}</td><td><b>${esc(o.orderNo)}</b></td><td><span class="pill ${o.payment==='Paid'?'ok':'low'}">${esc(o.payment)}</span></td><td class="num">$${fmt(o.gross)}</td><td class="num">−$${fmt(o.fees)}</td><td class="num"><b>$${fmt(o.gross-o.fees)}</b></td></tr>`).join('');
  const recentExpenseRows=latestExpenses.map(e=>`<tr><td>${esc(e.date)}</td><td><b>${esc(e.item)}</b></td><td>${esc(e.category||'Other')}</td><td class="num"><b>$${fmt(e.costSgd)}</b></td></tr>`).join('');
  const historyRows=state.syncHistory.slice(0,15).map(h=>`<tr><td>${formatUpdatedAt(h.updatedAt)}</td><td><span class="pill cat">${h.type==='shopee'?'Shopee':'Expenses'}</span></td><td>${esc(h.throughDate)}</td><td>${esc(h.lastRef||'—')}</td><td>${esc(h.note||'—')}</td><td><button class="icon-btn" onclick="deleteTrackerHistory('${h.id}')">✕</button></td></tr>`).join('');
  return `<div class="card"><h2>✅ Data Update Tracker</h2><p class="hint">Use “Updated Through” for the date covered by your receipts or Shopee report—not the date you are doing the data entry.</p><div class="row"><div class="field" style="max-width:220px"><label>Remind Me After</label><select onchange="state.trackerDueDays=Number(this.value);saveState();render();"><option value="3" ${state.trackerDueDays===3?'selected':''}>3 days</option><option value="7" ${state.trackerDueDays===7?'selected':''}>7 days</option><option value="14" ${state.trackerDueDays===14?'selected':''}>14 days</option><option value="30" ${state.trackerDueDays===30?'selected':''}>30 days</option></select></div></div></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px">${checkpointCard('expenses','💸 Expense Updates','Mark the last receipt date that has been fully entered. Then future you knows exactly where to continue.')}${checkpointCard('shopee','🛍️ Shopee Sales Updates','Mark the last Shopee order or report date that has been entered and checked.')}</div>
  <div class="card"><h2>🛍️ Shopee — ${currentKey} Summary</h2><div class="summary-grid"><div class="stat"><div class="label">Orders</div><div class="value">${monthShopee.length}</div></div><div class="stat"><div class="label">Gross Sales</div><div class="value">$${fmt(shopeeGross)}</div></div><div class="stat"><div class="label">Shopee Fees</div><div class="value">−$${fmt(shopeeFees)}</div></div><div class="stat"><div class="label">Net Payout</div><div class="value">$${fmt(shopeeGross-shopeeFees)}</div></div><div class="stat"><div class="label">Pending Payment</div><div class="value" style="color:var(--warn)">$${fmt(shopeePending)}</div></div></div>${recentShopeeRows?`<div style="overflow-x:auto;margin-top:14px"><table><tr><th>Date</th><th>PO</th><th>Payment</th><th class="num">Gross</th><th class="num">Fees</th><th class="num">Net</th></tr>${recentShopeeRows}</table></div>`:`<div class="empty">No Shopee orders recorded yet.</div>`}</div>
  <div class="card"><h2>💸 Latest Expense Entries</h2>${recentExpenseRows?`<div style="overflow-x:auto"><table><tr><th>Expense Date</th><th>Item</th><th>Category</th><th class="num">Amount</th></tr>${recentExpenseRows}</table></div>`:`<div class="empty">No expenses recorded yet.</div>`}</div>
  <div class="card"><h2>Checkpoint History</h2><p class="hint">A short audit trail of when you completed each update.</p>${historyRows?`<div style="overflow-x:auto"><table><tr><th>Saved On</th><th>Area</th><th>Covered Through</th><th>Last Reference</th><th>Note</th><th></th></tr>${historyRows}</table></div>`:`<div class="empty">No checkpoints saved yet.</div>`}</div>`;
}
function renderQuickStock(){
  const activeProducts=state.products.filter(p=>!p.archived);
  const categories=[...new Set(activeProducts.map(p=>p.category))].sort();
  if(!categories.includes(state.quickStockCategory)) state.quickStockCategory=categories[0]||'';
  const q=(state.quickStockSearch||'').toLowerCase().trim();
  const visible=activeProducts.filter(p=>p.category===state.quickStockCategory && (!q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q)));
  const categoryOptions=categories.map(c=>`<option value="${esc(c)}" ${state.quickStockCategory===c?'selected':''}>${esc(c)} (${activeProducts.filter(p=>p.category===c).length})</option>`).join('');
  const homeTotal=visible.reduce((sum,p)=>sum+(Number(p.stockHome)||0),0);
  const lockerTotal=visible.reduce((sum,p)=>sum+(Number(p.stockLocker)||0),0);
  const cards=visible.map(p=>`<div style="background:var(--bg-cream);border:1.5px solid var(--border);border-radius:16px;padding:14px"><h3 style="font-size:15px;margin:0 0 2px">${esc(p.name)}</h3><div class="msg">SKU: ${esc(p.sku)} · Total: ${(Number(p.stockHome)||0)+(Number(p.stockLocker)||0)}</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px"><div style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px"><label style="display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:7px">Home</label><div style="display:grid;grid-template-columns:42px 1fr 42px;gap:6px"><button class="audit-btn" aria-label="Remove one ${esc(p.name)} from Home" onclick="adjustQuickStock('${p.id}','stockHome',-1)">−</button><input aria-label="${esc(p.name)} Home quantity" type="number" min="0" value="${p.stockHome}" onchange="setQuickStockCount('${p.id}','stockHome',this.value)" style="width:100%;height:42px;border:1.5px solid var(--border);border-radius:10px;text-align:center;font-size:18px;font-weight:700;color:var(--text)"><button class="audit-btn" aria-label="Add one ${esc(p.name)} to Home" onclick="adjustQuickStock('${p.id}','stockHome',1)">+</button></div></div><div style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px"><label style="display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:7px">Suntec Locker</label><div style="display:grid;grid-template-columns:42px 1fr 42px;gap:6px"><button class="audit-btn" aria-label="Remove one ${esc(p.name)} from Suntec Locker" onclick="adjustQuickStock('${p.id}','stockLocker',-1)">−</button><input aria-label="${esc(p.name)} Suntec Locker quantity" type="number" min="0" value="${p.stockLocker}" onchange="setQuickStockCount('${p.id}','stockLocker',this.value)" style="width:100%;height:42px;border:1.5px solid var(--border);border-radius:10px;text-align:center;font-size:18px;font-weight:700;color:var(--text)"><button class="audit-btn" aria-label="Add one ${esc(p.name)} to Suntec Locker" onclick="adjustQuickStock('${p.id}','stockLocker',1)">+</button></div></div></div></div>`).join('');
  return `<div class="card"><h2>⚡ Quick Stock Count</h2><p class="hint">Choose a category and update quantities. Every change is saved immediately.</p><div class="row"><div class="field" style="min-width:240px"><label>Category</label><select onchange="state.quickStockCategory=this.value;state.quickStockSearch='';saveState();render();">${categoryOptions}</select></div><div class="field" style="min-width:240px"><label>Find Product</label><input value="${esc(state.quickStockSearch)}" placeholder="Name or SKU" onchange="state.quickStockSearch=this.value;saveState();render();"></div></div><div class="summary-grid" style="margin-top:14px"><div class="stat"><div class="label">Products Shown</div><div class="value">${visible.length}</div></div><div class="stat"><div class="label">Home Units</div><div class="value">${homeTotal}</div></div><div class="stat"><div class="label">Suntec Units</div><div class="value">${lockerTotal}</div></div></div></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px">${cards||'<div class="card empty">No products found in this category.</div>'}</div>`;
}
function renderAudit(){  const lockerOnlyProducts = state.products.filter(p => !p.archived && p.stockLocker > 0);
  const rows = lockerOnlyProducts.map(p=>{    const cnt = state.auditDraft[p.id] !== undefined ? state.auditDraft[p.id] : p.stockLocker;    const diff = cnt - p.stockLocker;    let diffPill = `<span class="pill ok">Match</span>`;    if(diff > 0) diffPill = `<span class="pill low">+${diff}</span>`;    if(diff < 0) diffPill = `<span class="pill out">${diff}</span>`;
    return `    <div class="audit-card">      <div>        <b>${esc(p.name)}</b>        <div class="msg">SKU: ${esc(p.sku)} | Category: ${esc(p.category)} | Expected: ${p.stockLocker} ${diffPill}</div>      </div>      <div style="display:flex;align-items:center;gap:10px">        <button class="audit-btn" onclick="adjustAuditCount('${p.id}', -1)">−</button>        <span style="font-size:18px;font-weight:bold;width:30px;text-align:center">${cnt}</span>        <button class="audit-btn" onclick="adjustAuditCount('${p.id}', 1)">+</button>      </div>    </div>`;  }).join('');
  return `  <div class="card">    <h2>📱 Fast Mobile Walk-the-Locker Mode</h2>    <p class="hint">Showing strictly items with active Locker Inventory (${lockerOnlyProducts.length} items at Suntec).</p>    <button class="btn" onclick="saveAuditState()">💾 Save Audit &amp; Sync System Stock</button>  </div>  <div class="card">    ${lockerOnlyProducts.length===0 ? `<div class="empty">No products currently have stock registered at the locker (Locker Stock = 0). Restock the locker or update stock levels in the Catalog tab.</div>` : rows}  </div>`;}
function renderSummary(){
  const year=state.pnlYear,month=state.pnlMonth;
  const matchesPeriod=date=>{const d=String(date||'');return /^\d{4}-\d{2}-\d{2}$/.test(d)&&(year==='All'||d.slice(0,4)===year)&&(month==='All'||d.slice(5,7)===month);};
  const orderValue=o=>Number(o.totalPrice)||((Number(o.qty)||0)*(Number(o.unitPrice)||0));
  const orderCount=items=>new Set(items.map(o=>o.orderNo||o.groupId||o.id)).size;
  const filteredOrders=state.orders.filter(o=>o.payment!=='Gift'&&matchesPeriod(o.date));
  const filteredExpenses=state.expenses.filter(e=>matchesPeriod(e.date));
  const lockerSales=state.movements.filter(m=>m.type==='sale'&&matchesPeriod(m.date));
  const toyOrders=filteredOrders.filter(o=>o.channel==='Toy Outpost'||String(o.orderNo||'').startsWith('TOY'));
  const shopeeOrders=filteredOrders.filter(o=>o.channel==='Shopee'||String(o.orderNo||'').startsWith('SHP'));
  const directOrders=filteredOrders.filter(o=>!toyOrders.includes(o)&&!shopeeOrders.includes(o));
  const grossToyOrders=toyOrders.reduce((s,o)=>s+orderValue(o),0);
  const grossLockerLogs=lockerSales.reduce((s,m)=>s+(Number(m.qty)||0)*(Number(m.unitPrice)||0),0);
  const grossToy=grossToyOrders+grossLockerLogs;
  const lockerFee=grossToy*(Number(state.locker.feePct)||0)/100;
  const grossShopee=shopeeOrders.reduce((s,o)=>s+orderValue(o),0);
  const shopeeFeesTotal=shopeeOrders.reduce((s,o)=>s+(Number(o.shopeeFeeAmt)||0)+(Number(o.shopeeShippingAmt)||0),0);
  const grossDirect=directOrders.reduce((s,o)=>s+orderValue(o),0);
  const totalGrossRevenue=grossToy+grossShopee+grossDirect;
  const totalOperatingExp=filteredExpenses.reduce((s,e)=>s+(Number(e.costSgd)||0),0);
  const rentEntries=Object.entries(state.monthlyRent||{}).filter(([key])=>(year==='All'||key.slice(0,4)===year)&&(month==='All'||key.slice(5,7)===month));
  const monthKey=(year!=='All'&&month!=='All')?`${year}-${month}`:'';
  const totalRent=monthKey?(state.monthlyRent[monthKey]!==undefined?Number(state.monthlyRent[monthKey]):Number(state.locker.rent)||0):rentEntries.reduce((s,[,v])=>s+(Number(v)||0),0);
  const filteredAdj=state.pnlAdjustments.filter(a=>matchesPeriod(a.date));
  const totalPnlAdj=filteredAdj.reduce((s,a)=>s+(Number(a.amount)||0),0);
  const netProfit=totalGrossRevenue-lockerFee-totalOperatingExp-totalRent+totalPnlAdj;
  const pendingOrders=filteredOrders.filter(o=>o.payment==='Pending');
  const outstanding=pendingOrders.reduce((s,o)=>s+orderValue(o),0);
  const cashReceived=grossLockerLogs+filteredOrders.filter(o=>o.payment==='Paid').reduce((s,o)=>s+orderValue(o),0);
  const allDates=[...state.orders,...state.expenses,...state.movements,...state.pnlAdjustments].map(x=>String(x.date||'')).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d));
  const years=[...new Set([...allDates.map(d=>d.slice(0,4)),String(new Date().getFullYear())])].sort().reverse();
  const latestDate=allDates.sort().at(-1)||new Date().toISOString().slice(0,10);
  const latestYear=latestDate.slice(0,4),latestMonth=latestDate.slice(5,7);
  const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const yearOptions=years.map(y=>`<option value="${y}" ${year===y?'selected':''}>${y}</option>`).join('');
  const monthOptions=monthNames.map((name,i)=>{const value=String(i+1).padStart(2,'0');return `<option value="${value}" ${month===value?'selected':''}>${value} - ${name}</option>`;}).join('');
  const invalidRecords=[...state.orders,...state.expenses,...state.movements].filter(x=>!/^\d{4}-\d{2}-\d{2}$/.test(String(x.date||''))).length;
  const duplicateWarning=toyOrders.length&&lockerSales.length?`<div style="margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:12px"><b>Check for duplicates:</b> this period contains Toy Outpost POs and Locker Sale logs. Both are included; do not enter the same sale in both places.</div>`:'';
  const filterNote=(year!==latestYear||month!==latestMonth)&&year!=='All'&&month!=='All'?`<div style="margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--lav-pale);font-size:12px">Latest activity is in <b>${latestYear}-${latestMonth}</b>. <button class="btn sm ghost" onclick="state.pnlYear='${latestYear}';state.pnlMonth='${latestMonth}';saveState();render();">Show Latest</button></div>`:'';
  const mummyShare=Math.max(0,netProfit*.50),klarissaShare=Math.max(0,netProfit*.20),daddyShare=Math.max(0,netProfit*.20),khylerShare=Math.max(0,netProfit*.10);
  const adjRows=filteredAdj.map(a=>`<tr><td>${a.date}</td><td>${esc(a.note)}</td><td class="num"><b>${a.amount>=0?'+$'+fmt(a.amount):'−$'+fmt(Math.abs(a.amount))}</b></td><td><button class="icon-btn" onclick="deletePnlAdjustment('${a.id}')">✕</button></td></tr>`).join('');
  return `<div class="card"><h2>📊 Simple P&amp;L Dashboard</h2><p class="hint">A straightforward view of money earned and business expenses. Product production costs are not deducted here.</p><div class="row" style="max-width:760px;margin-bottom:14px"><div class="field"><label>Filter Year</label><select onchange="state.pnlYear=this.value;saveState();render();"><option value="All" ${year==='All'?'selected':''}>All Years</option>${yearOptions}</select></div><div class="field"><label>Filter Month</label><select onchange="state.pnlMonth=this.value;saveState();render();"><option value="All" ${month==='All'?'selected':''}>All Months</option>${monthOptions}</select></div>${monthKey?`<div class="field"><label>Monthly Locker Rent ($)</label><input type="number" value="${totalRent}" onchange="updateMonthlyRent('${monthKey}',this.value)"></div>`:`<div class="field"><label>Rent in Selected Period</label><input value="$${fmt(totalRent)}" readonly></div>`}</div>

  <div class="row"><div class="field"><label>Date</label><input id="ord-date" type="date" value="${h.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Channel</label><select id="ord-channel" onchange="changeOrderChannel()"><option ${h.channel==='Direct / IG'?'selected':''}>Direct / IG</option><option ${h.channel==='Shopee'?'selected':''}>Shopee</option><option ${h.channel==='Toy Outpost'?'selected':''}>Toy Outpost</option></select></div><div class="field"><label>PO Number</label><input id="ord-no-preview" value="${esc(defaultOrderNo)}"></div><div class="field"><label>Customer</label><input id="ord-customer" value="${esc(h.customer||'')}" placeholder="Customer name"></div><div class="field"><label>Payment</label><select id="ord-pay"><option ${h.payment==='Paid'?'selected':''}>Paid</option><option ${h.payment==='Pending'?'selected':''}>Pending</option></select></div><div class="field"><label>Status</label><select id="ord-status"><option ${h.status==='Pending Print'?'selected':''}>Pending Print</option><option ${h.status==='Printed'?'selected':''}>Printed</option><option ${h.status==='Delivered'?'selected':''}>Delivered</option></select></div></div>
  <div class="row" style="margin-top:12px;padding:12px;background:var(--bg-cream);border-radius:12px"><div class="field"><label>1. Category</label><select id="ord-category" onchange="setOrderCategory(this.value)">${categoryOptions}</select></div><div class="field" style="flex:2"><label>2. Product</label><select id="ord-product" onchange="autoFillOrderPrice()" ${productsInCategory.length?'':'disabled'}>${prodOptions}</select></div><div class="field"><label>Qty</label><input id="ord-qty" type="number" min="1" value="1"></div><div class="field"><label>Discount %</label><input id="ord-disc" type="number" min="0" max="100" value="0" onchange="autoFillOrderPrice()"></div><div class="field"><label>Price / Item</label><input id="ord-price" type="number" step="0.01" placeholder="Auto"></div><div class="field" style="flex:2"><label>Details</label><input id="ord-details" placeholder="Animal, colour, name or variation"></div><button class="btn" onclick="addOrderItem()" ${productsInCategory.length?'':'disabled'}>+ Add Item</button></div>
  <div id="shopee-fee-box" class="row" style="margin-top:10px;${h.channel==='Shopee'?'':'display:none'}"><div class="field"><label>Shopee Fee ($)</label><input id="ord-shopee-feeamt" type="number" min="0" step="0.01" value="${h.shopeeFeeAmt||0}" oninput="calculateShopeeNetPayout()"></div><div class="field"><label>Shipping Charged to You ($)</label><input id="ord-shopee-shipping" type="number" min="0" step="0.01" value="${h.shopeeShipping||0}" oninput="calculateShopeeNetPayout()"></div><div class="field"><label>Estimated Net Payout ($)</label><input id="ord-shopee-netpayout" value="${fmt(draftTotal-(Number(h.shopeeFeeAmt)||0)-(Number(h.shopeeShipping)||0))}" readonly></div></div>
  ${state.orderDraft.length?`<div style="overflow-x:auto;margin-top:14px"><table><tr><th>Item</th><th>Details</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Subtotal</th><th></th></tr>${draftRows}<tr><td colspan="4"><b>PO Total</b></td><td class="num"><b>$${fmt(draftTotal)}</b></td><td></td></tr></table></div>`:`<div class="empty">No items added to this PO yet.</div>`}
  <div class="row" style="margin-top:12px"><button class="btn" onclick="addOrder()">Save Complete PO</button><button class="btn ghost" onclick="clearOrderDraft()">Clear Draft</button></div></div>
  ${editor}<div class="card"><h2>PO History (${Object.keys(groups).length} POs / ${state.orders.length} items)</h2><p class="hint">Change Payment or Status directly, or choose Edit to correct the full PO.</p>${history?`<div style="overflow-x:auto"><table><tr><th>PO</th><th>Customer</th><th>Items</th><th class="num">Units</th><th class="num">Total</th><th>Payment</th><th>Status</th><th>Actions</th></tr>${history}</table></div>`:`<div class="empty">No orders logged yet.</div>`}</div>`;
}
function renderLog(){  const options = state.products.map(p=>`<option value="${p.id}">${esc(p.name)} (Home: ${p.stockHome} | Locker: ${p.stockLocker})</option>`).join('');  const rows = state.movements.map(m=>{    const p = state.products.find(p=>p.id===m.productId);    const label = {sale:'🛍️ Locker Sale', restock:'🔄 Restock (Home→Locker)', adjustment:'⚠️ Shrinkage/Damage'}[m.type];    return `<tr>      <td>${m.date}</td>      <td>${label}</td>      <td>${p ? esc(p.name) : '(Deleted)'}</td>      <td class="num">${m.qty}</td>      <td class="num">${m.type==='sale' ? '$'+fmt(m.qty*m.unitPrice) : '—'}</td>      <td>${esc(m.note||'')}</td>      <td><button class="icon-btn" onclick="deleteMovement('${m.id}')">✕</button></td>    </tr>`;  }).join('');
  return `  <div class="card">    <h2>Log Toy Outpost Suntec Activity (With Home Transfer)</h2>    <div class="row">      <div class="field" style="flex:2"><label>Product</label><select id="mv-product">${options}</select></div>      <div class="field"><label>Type</label>        <select id="mv-type">          <option value="restock">Locker Restock (Deducts Home -> Adds Locker)</option>          <option value="sale">Locker Sale (Deducts Locker Stock)</option>          <option value="adjustment">Shrinkage / Loss (Deducts Locker Stock)</option>        </select>      </div>      <div class="field"><label>Qty</label><input id="mv-qty" type="number" value="1"></div>      <div class="field"><label>Date</label><input id="mv-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>      <div class="field"><label>Note</label><input id="mv-note" placeholder="Optional"></div>      <button class="btn" onclick="logMovement()">Save Log</button>    </div>  </div>  <div class="card">    <h2>Locker Log History</h2>    ${state.movements.length===0 ? `<div class="empty">No locker activity recorded yet.</div>` : `    <table>      <tr><th>Date</th><th>Type</th><th>Product</th><th class="num">Qty</th><th class="num">Total</th><th>Note</th><th></th></tr>      ${rows}    </table>`}  </div>`;}
function renderExpenses(){
  const categoryOptions=selected=>state.expenseCategories.map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('');
  const vendorOptions=selected=>['Other','拼多多 (Pinduoduo)','淘宝 (Taobao)','AliExpress','Shopee','Bambu Lab','SingPost'].map(v=>`<option ${v===selected?'selected':''}>${esc(v)}</option>`).join('');
  const groupedItems=state.expenseCategories.map(category=>{const items=state.expenseItems.filter(i=>i.category===category).sort((a,b)=>a.name.localeCompare(b.name));return items.length?`<optgroup label="${esc(category)}">${items.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</optgroup>`:'';}).join('');
  const ungrouped=state.expenseItems.filter(i=>!state.expenseCategories.includes(i.category));
  const presetOptions=groupedItems+(ungrouped.length?`<optgroup label="Other">${ungrouped.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</optgroup>`:'');
  const validDates=state.expenses.map(e=>String(e.date||'')).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d));
  const years=[...new Set(validDates.map(d=>d.slice(0,4)))].sort().reverse();
  const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const query=String(state.expenseSearch||'').toLowerCase().trim();
  const filtered=state.expenses.filter(e=>{const d=String(e.date||'');return (state.expYear==='All'||d.slice(0,4)===state.expYear)&&(state.expMonth==='All'||d.slice(5,7)===state.expMonth)&&(state.expenseFilterCategory==='All'||e.category===state.expenseFilterCategory)&&(!query||String(e.item||'').toLowerCase().includes(query)||String(e.vendor||'').toLowerCase().includes(query));});
  const total=filtered.reduce((s,e)=>s+(Number(e.costSgd)||0),0);
  const totalsByCategory={};filtered.forEach(e=>totalsByCategory[e.category||'Other']=(totalsByCategory[e.category||'Other']||0)+(Number(e.costSgd)||0));
  const categoryBreakdown=Object.entries(totalsByCategory).sort((a,b)=>b[1]-a[1]);
  const largest=categoryBreakdown[0]||['—',0];
  const rows=filtered.map(e=>`<tr><td>${esc(e.date)}</td><td><select class="tbl-input" aria-label="Category for ${esc(e.item)}" onchange="updateExpenseCategory('${e.id}',this.value)">${categoryOptions(e.category||'Other')}</select></td><td><b>${esc(e.item)}</b></td><td>${esc(e.vendor||'—')}</td><td class="num">${e.curr==='RMB'?'¥'+fmt(e.rawCost):'—'}</td><td class="num"><b>$${fmt(e.costSgd)}</b></td><td><button class="icon-btn" aria-label="Delete ${esc(e.item)}" onclick="deleteExpense('${e.id}')">✕</button></td></tr>`).join('');
  const libraryRows=state.expenseItems.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td><select class="tbl-input" onchange="updateExpenseItemField('${i.id}','category',this.value)">${categoryOptions(i.category)}</select></td><td><select class="tbl-input" onchange="updateExpenseItemField('${i.id}','vendor',this.value)">${vendorOptions(i.vendor||'Other')}</select></td><td><select class="tbl-input" onchange="updateExpenseItemField('${i.id}','curr',this.value)"><option ${i.curr==='SGD'?'selected':''}>SGD</option><option ${i.curr==='RMB'?'selected':''}>RMB</option></select></td><td><button class="icon-btn" aria-label="Remove ${esc(i.name)}" onclick="deleteExpenseItem('${i.id}')">✕</button></td></tr>`).join('');
  return `<div class="card"><h2>💸 Add an Expense</h2><p class="hint">Choose a saved item to fill its category automatically, or type a new description and use the suggested category.</p><div class="row"><div class="field"><label>Date</label><input id="exp-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field" style="flex:1.5"><label>Saved Expense Item</label><select id="exp-preset" onchange="syncPresetExpense()"><option value="custom">— Type a new item —</option>${presetOptions}</select></div><div class="field" style="flex:2"><label>Item / Description</label><input id="exp-item" placeholder="e.g. Magnets, Canva subscription" onchange="suggestExpenseCategory()"><span id="expense-category-suggestion" class="msg"></span></div><div class="field"><label>Category</label><select id="exp-category">${categoryOptions('Materials')}</select></div><div class="field"><label>Vendor</label><select id="exp-vendor">${vendorOptions('Other')}</select></div></div><div class="row" style="margin-top:10px"><div class="field"><label>Currency</label><select id="exp-curr" onchange="autoConvertExpenseCost()"><option value="SGD">SGD ($)</option><option value="RMB">RMB (¥)</option></select></div><div class="field"><label>Original Cost</label><input id="exp-rawcost" type="number" min="0" step="0.01" oninput="autoConvertExpenseCost()"></div><div class="field"><label>Cost in SGD</label><input id="exp-costSgd" type="number" min="0" step="0.01"></div><button class="btn" onclick="addExpense()">Save Expense</button></div></div>
  <div class="card"><details><summary style="cursor:pointer;font-family:'Quicksand',sans-serif;font-weight:700">➕ Add or Manage Reusable Expense Items (${state.expenseItems.length})</summary><p class="hint" style="margin-top:10px">Save an item once, together with its normal category, vendor and currency.</p><div class="row"><div class="field" style="flex:2"><label>New Item Name</label><input id="new-exp-item" placeholder="e.g. Round Magnets" onchange="document.getElementById('new-exp-item-category').value=suggestExpenseCategoryName(this.value)"></div><div class="field"><label>Category</label><select id="new-exp-item-category">${categoryOptions('Materials')}</select></div><div class="field"><label>Default Vendor</label><select id="new-exp-item-vendor">${vendorOptions('Other')}</select></div><div class="field"><label>Currency</label><select id="new-exp-item-curr"><option>SGD</option><option>RMB</option></select></div><button class="btn" onclick="addExpenseItem()">+ Save Item</button></div><div style="overflow-x:auto;max-height:340px;margin-top:14px"><table><tr><th>Reusable Item</th><th>Category</th><th>Vendor</th><th>Currency</th><th></th></tr>${libraryRows}</table></div><div class="row" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)"><div class="field"><label>Add a New Category</label><input id="new-exp-category" placeholder="e.g. Photography"></div><button class="btn ghost" onclick="addExpenseCategory()">+ Add Category</button></div></details></div>
  <div class="card"><h2>Expense History</h2><div class="row"><div class="field"><label>Year</label><select onchange="state.expYear=this.value;saveState();render();"><option value="All" ${state.expYear==='All'?'selected':''}>All Years</option>${years.map(y=>`<option ${state.expYear===y?'selected':''}>${y}</option>`).join('')}</select></div><div class="field"><label>Month</label><select onchange="state.expMonth=this.value;saveState();render();"><option value="All" ${state.expMonth==='All'?'selected':''}>All Months</option>${monthNames.map((name,i)=>{const value=String(i+1).padStart(2,'0');return `<option value="${value}" ${state.expMonth===value?'selected':''}>${value} - ${name}</option>`;}).join('')}</select></div><div class="field"><label>Category</label><select onchange="state.expenseFilterCategory=this.value;saveState();render();"><option value="All" ${state.expenseFilterCategory==='All'?'selected':''}>All Categories</option>${categoryOptions(state.expenseFilterCategory)}</select></div><div class="field" style="flex:2"><label>Search</label><input value="${esc(state.expenseSearch)}" placeholder="Item or vendor" onchange="state.expenseSearch=this.value;saveState();render();"></div></div><div class="summary-grid" style="margin-top:14px"><div class="stat"><div class="label">Expenses Shown</div><div class="value">${filtered.length}</div></div><div class="stat"><div class="label">Total Expenses</div><div class="value">$${fmt(total)}</div></div><div class="stat"><div class="label">Largest Category</div><div class="value" style="font-size:15px">${esc(largest[0])}</div><div class="msg">$${fmt(largest[1])}</div></div></div>${categoryBreakdown.length?`<div class="cat-bar" style="margin-top:14px">${categoryBreakdown.map(([c,v])=>`<span class="pill cat">${esc(c)}: $${fmt(v)}</span>`).join('')}</div>`:''}${rows?`<div style="overflow-x:auto;margin-top:10px"><table><tr><th>Date</th><th style="min-width:170px">Category</th><th>Description</th><th>Vendor</th><th class="num">RMB</th><th class="num">SGD</th><th></th></tr>${rows}</table></div>`:`<div class="empty">No expenses match these filters.</div>`}</div>`;
}
function renderFilament(){  const rows = state.filaments.map(f=>{    let pct = Math.min(100, Math.round((f.weightGrams / 1000) * 100));    let pillClass = pct > 50 ? 'ok' : (pct > 20 ? 'low' : 'out');    return `<tr>      <td><b>${esc(f.brand)}</b></td>      <td>${esc(f.color)}</td>      <td>${esc(f.vendor)}</td>      <td class="num">¥${fmt(f.costRmb)} / $${fmt(f.costSgd)}</td>      <td class="num">        <input class="tbl-input num-in" style="width:80px" type="number" value="${f.weightGrams}" onchange="updateFilamentWeight('${f.id}', this.value)"> g      </td>      <td><span class="pill ${pillClass}">${pct}% Left</span></td>      <td><button class="icon-btn" onclick="deleteFilament('${f.id}')">✕</button></td>    </tr>`;  }).join('');
  return `  <div class="card">    <h2>Track Filament Inventory &amp; Vendors</h2>    <div class="row">      <div class="field"><label>Vendor</label>        <select id="fil-vendor">          <option value="淘宝 (Taobao)">淘宝 (Taobao)</option>          <option value="拼多多 (Pinduoduo)">拼多多 (Pinduoduo)</option>          <option value="Shopee">Shopee</option>          <option value="Others">Others</option>        </select>      </div>      <div class="field"><label>Brand / Material</label><input id="fil-brand" placeholder="e.g. eSun PLA+"></div>      <div class="field"><label>Color</label><input id="fil-color" placeholder="e.g. Matte Pastel Blue"></div>      <div class="field"><label>Spool Cost (RMB ¥)</label><input id="fil-rmb" type="number" step="0.1" placeholder="e.g. 45"></div>      <div class="field"><label>Spool Cost (SGD $)</label><input id="fil-sgd" type="number" step="0.1" placeholder="Or SGD"></div>      <div class="field"><label>Remaining (g)</label><input id="fil-weight" type="number" value="1000"></div>      <button class="btn" onclick="addFilament()">Add Spool</button>    </div>  </div>  <div class="card">    <h2>Filament Spools Stock</h2>    <table>      <tr><th>Brand / Material</th><th>Color</th><th>Vendor</th><th class="num">Cost</th><th class="num">Remaining Weight</th><th>Stock Level</th><th></th></tr>      ${rows}    </table>  </div>`;}
function renderCostFormula(){  return `  <div class="card">    <h2>📐 Business Unit Cost Formulas &amp; Explanation</h2>    <p class="hint">How item unit costs are structured based on your Excel production assumptions.</p>        <div class="formula-box">      <b>Unit Cost Formula:</b><br>      Unit Cost = Raw Filament Cost + Multi-Color Waste + Accessories + Packaging + Electricity    </div>
    <table>      <tr><th>Cost Component</th><th>Excel Standard Assumption</th><th class="num">Unit Value (SGD)</th></tr>      <tr>        <td><b>Raw Filament Plastic</b></td>        <td>20g tag printed from $21.45/kg spool (USD-SGD 1.3 rate)</td>        <td class="num">$0.43</td>      </tr>      <tr>        <td><b>Multi-Color Purge Waste</b></td>        <td>Waste poop &amp; prime tower allocation (2-color assume)</td>        <td class="num">$0.20</td>      </tr>      <tr>        <td><b>Accessories &amp; Hardware</b></td>        <td>Keyring, lobster clasp, or ball chain attachment</td>        <td class="num">$0.55</td>      </tr>      <tr>        <td><b>Packaging &amp; Presentation</b></td>        <td>Self-adhesive laser bag, label, backing card</td>        <td class="num">$0.40</td>      </tr>      <tr>        <td><b>Printer Electricity Usage</b></td>        <td>Bambu Lab printer wattage over print duration</td>        <td class="num">$0.05</td>      </tr>      <tr style="font-weight:bold;background:var(--bg-cream)">        <td>TOTAL ESTIMATED UNIT COST</td>        <td>Standard Tag Baseline</td>        <td class="num">$1.63</td>      </tr>    </table>  </div>
  <div class="card">    <h2>🧪 Interactive Unit Cost Calculator Sandbox</h2>    <p class="hint">Adjust individual parameters below to see how changes in weight or hardware affect your per-unit cost.</p>    <div class="row">      <div class="field"><label>Filament Used (g)</label><input id="sb-grams" type="number" value="20" oninput="calculateCostSandbox()"></div>      <div class="field"><label>Spool Price ($/kg)</label><input id="sb-filcost" type="number" value="21.45" oninput="calculateCostSandbox()"></div>      <div class="field"><label>Purge Waste ($)</label><input id="sb-waste" type="number" step="0.05" value="0.20" oninput="calculateCostSandbox()"></div>      <div class="field"><label>Accessories ($)</label><input id="sb-acc" type="number" step="0.05" value="0.55" oninput="calculateCostSandbox()"></div>      <div class="field"><label>Packaging ($)</label><input id="sb-pack" type="number" step="0.05" value="0.40" oninput="calculateCostSandbox()"></div>      <div class="field"><label>Electricity ($)</label><input id="sb-elec" type="number" step="0.01" value="0.05" oninput="calculateCostSandbox()"></div>    </div>
    <div class="summary-grid" style="margin-top:14px">      <div class="stat"><div class="label">Filament Cost</div><div class="value" id="sb-res-fil">$0.43</div></div>      <div class="stat"><div class="label">Waste Allocation</div><div class="value" id="sb-res-waste">$0.20</div></div>      <div class="stat"><div class="label">Accessories</div><div class="value" id="sb-res-acc">$0.55</div></div>      <div class="stat"><div class="label">Packaging</div><div class="value" id="sb-res-pack">$0.40</div></div>      <div class="stat"><div class="label">Electricity</div><div class="value" id="sb-res-elec">$0.05</div></div>      <div class="stat profit"><div class="label">Calculated Unit Cost</div><div class="value pos" id="sb-res-unitcost">$1.63</div></div>    </div>  </div>`;}
function renderCalculator(){  const filOptions = state.filaments.map(f=>`<option value="${f.id}">${esc(f.brand)} - ${esc(f.color)} ($${fmt(f.costSgd)}/kg)</option>`).join('');
  return `  <div class="card">    <h2>Singapore 3D Printing Cost &amp; Pricing Calculator</h2>    <p class="hint">Select active filament from inventory or type manual spool cost ($/kg).</p>    <div class="row" style="margin-bottom:12px">      <div class="field" style="flex:2"><label>Pull Filament Cost from Stock</label>        <select id="calc-fil-select" onchange="syncCalculatorFilament()">          <option value="">-- Manual Input or Select Below --</option>          ${filOptions}        </select>      </div>    </div>    <div class="row">      <div class="field"><label>Filament Used (Grams)</label><input id="calc-grams" type="number" value="20" oninput="calculatePrintCost()"></div>      <div class="field"><label>Filament Cost ($ / kg)</label><input id="calc-filcost" type="number" value="21.45" oninput="calculatePrintCost()"></div>      <div class="field"><label>Print Time (Hours)</label><input id="calc-hours" type="number" step="0.1" value="1.5" oninput="calculatePrintCost()"></div>      <div class="field"><label>Printer Power (Watts)</label><input id="calc-watts" type="number" value="150" oninput="calculatePrintCost()"></div>    </div>    <div class="row" style="margin-top:10px">      <div class="field"><label>Accessories Cost ($)</label><input id="calc-acc" type="number" step="0.05" value="0.55" oninput="calculatePrintCost()"></div>      <div class="field"><label>Packaging Cost ($)</label><input id="calc-pack" type="number" step="0.05" value="0.40" oninput="calculatePrintCost()"></div>      <div class="field"><label>Desired Profit Markup (%)</label><input id="calc-markup" type="number" value="150" oninput="calculatePrintCost()"></div>    </div>  </div>  <div class="card">    <h2>Calculated Job Breakdown</h2>    <div class="summary-grid">      <div class="stat"><div class="label">Material Cost</div><div class="value" id="calc-res-mat">$0.00</div></div>      <div class="stat"><div class="label">SG Electricity Cost</div><div class="value" id="calc-res-power">$0.00</div></div>      <div class="stat"><div class="label">Total Unit Cost</div><div class="value" id="calc-res-total">$0.00</div></div>      <div class="stat profit"><div class="label">Suggested Sell Price</div><div class="value pos" id="calc-res-price">$0.00</div></div>      <div class="stat profit"><div class="label">Estimated Unit Profit</div><div class="value pos" id="calc-res-profit">$0.00</div></div>    </div>  </div>`;}
loadState();</script></body></html>
