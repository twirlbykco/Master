<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Twirlbykco Master hub</title>
<style>
  :root{
    --bg:#FBF2F6;
    --bg-card:#FFFFFF;
    --bg-cream:#FFF8F3;
    --lav:#C3AEE0;
    --lav-dark:#8E6FBE;
    --lav-pale:#EFE6F8;
    --text:#4A3B52;
    --muted:#9A8AA3;
    --border:#F0DCE6;
    --success:#6FAE84;
    --success-bg:#E9F5EC;
    --warn:#D99A3F;
    --warn-bg:#FBF0DE;
    --danger:#D9748A;
    --danger-bg:#FBE7EC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Poppins','Segoe UI',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Quicksand','Poppins',sans-serif; font-weight:700; }
  #app{max-width:1420px;margin:0 auto;padding:20px 16px 60px;}

  .header{
    background:linear-gradient(135deg,var(--lav) 0%,#D9C3EE 100%);
    border-radius:22px; padding:22px 24px; color:#fff; position:relative; overflow:hidden; margin-bottom:18px;
  }
  .header::after{
    content:""; position:absolute; right:-30px;top:-30px; width:140px;height:140px;
    border-radius:50%; background:rgba(255,255,255,0.15);
  }
  .header .eyebrow{ font-size:12px;letter-spacing:1.5px;text-transform:uppercase; opacity:0.85; margin-bottom:4px; }
  .header h1{margin:0 0 6px 0;font-size:26px;}
  .header .sub{font-size:13px;opacity:0.92;}
  .badges{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .badge{
    background:rgba(255,255,255,0.22); border:1px solid rgba(255,255,255,0.35);
    border-radius:999px; padding:6px 13px; font-size:12px; display:flex;align-items:center;gap:6px;
  }
  .badge input{
    width:65px;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.6);
    color:#fff;font-size:12px;font-family:inherit;text-align:right;
  }
  .badge input:focus{outline:none;border-bottom:1px solid #fff;}

  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tab{
    border:none;background:var(--bg-card);color:var(--muted); padding:9px 15px;
    border-radius:999px;font-family:'Quicksand',sans-serif; font-weight:700;font-size:13px;
    cursor:pointer;border:1.5px solid var(--border); transition:all .15s ease;
  }
  .tab:hover{border-color:var(--lav);}
  .tab.active{background:var(--lav-dark);color:#fff;border-color:var(--lav-dark);}

  .cat-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .cat-chip{
    padding:5px 12px; border-radius:999px; font-size:11.5px; font-weight:600;
    background:var(--bg-cream); border:1px solid var(--border); color:var(--text); cursor:pointer;
  }
  .cat-chip:hover{border-color:var(--lav-dark);}
  .cat-chip.active{background:var(--lav-dark); color:#fff; border-color:var(--lav-dark);}

  .card{ background:var(--bg-card); border:1px solid var(--border); border-radius:18px; padding:18px 20px; margin-bottom:16px; }
  .card h2{margin:0 0 4px 0;font-size:16.5px;}
  .card .hint{color:var(--muted);font-size:12px;margin:0 0 14px 0;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{ text-align:left;color:var(--muted);font-weight:600;font-size:11px; text-transform:uppercase;letter-spacing:.4px; padding:8px 6px;border-bottom:1.5px solid var(--border); }
  td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}

  .pill{border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:600;display:inline-block;}
  .pill.ok{background:var(--success-bg);color:var(--success);}
  .pill.low{background:var(--warn-bg);color:var(--warn);}
  .pill.out{background:var(--danger-bg);color:var(--danger);}
  .pill.cat{background:var(--lav-pale);color:var(--lav-dark);border:1px solid var(--lav);}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px;}
  .field label{font-size:11px;color:var(--muted);font-weight:600;}
  .field input,.field select{
    padding:8px 10px;border-radius:10px;border:1.5px solid var(--border);
    font-family:inherit;font-size:12.5px;background:var(--bg-cream);color:var(--text);
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--lav);}

  .tbl-input{
    width:100%; padding:4px 6px; border:1px solid var(--border); border-radius:6px;
    background:var(--bg-cream); font-family:inherit; font-size:12px; color:var(--text);
  }
  .tbl-input.num-in{ text-align:right; width:60px; }
  .tbl-input:focus{ outline:none; border-color:var(--lav-dark); background:#fff; }

  .btn{ background:var(--lav-dark);color:#fff;border:none;border-radius:10px; padding:9px 16px;font-family:'Quicksand',sans-serif;font-weight:700; font-size:13px;cursor:pointer; }
  .btn:hover{background:#7C5CAC;}
  .btn.ghost{background:transparent;color:var(--lav-dark);border:1.5px solid var(--lav);}
  .btn.ghost:hover{background:var(--lav-pale);}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#C2607A;}
  .btn.sm{padding:5px 10px;font-size:11.5px;}

  .empty{ text-align:center;color:var(--muted);padding:28px 10px;font-size:13px; }
  .icon-btn{ background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:2px 5px; }
  .icon-btn:hover{color:var(--danger);}

  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:6px;}
  .stat{background:var(--bg-cream);border-radius:14px;padding:12px 14px;}
  .stat .label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600;}
  .stat .value{font-family:'Quicksand',sans-serif;font-weight:700;font-size:18px;margin-top:3px;}
  .stat.profit .value.pos{color:var(--success);}
  .stat.profit .value.neg{color:var(--danger);}

  .loading{text-align:center;padding:60px 0;color:var(--muted);font-size:14px;}
  .msg{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .search-box{
    width:100%; margin-bottom:10px; padding:10px 14px; border-radius:12px;
    border:2px solid var(--lav); font-family:inherit; font-size:13.5px; background:#fff;
  }
  
  .formula-box{
    background:var(--bg-cream); border:1.5px solid var(--border); border-radius:12px;
    padding:14px 16px; margin-bottom:12px; font-family:monospace; font-size:13px; color:var(--text);
  }
</style>
</head>

function loadState(){
  try{
    const loaded = localStorage.getItem(STORE_KEY);
    if(loaded){
      const parsed = JSON.parse(loaded);
      state = Object.assign(state, parsed);
      if(!state.products || state.products.length === 0){ state.products = EXCEL_PRODUCTS; }
      state.products.forEach(p=>{
        if(!p.category) p.category = 'Accessories & Others';
        if(p.stockHome === undefined) p.stockHome = 5;
        if(p.stockLocker === undefined) p.stockLocker = p.stock || 2;
      });
    }
  }catch(e){}
  render();
}

function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(n){ return (Math.round(n*100)/100).toFixed(2); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function setTab(t){ state.activeTab = t; render(); }

// ---------- PRODUCT & CATEGORY MANAGEMENT ----------
function addProduct(){
  const sku = document.getElementById('np-sku').value.trim();
  const name = document.getElementById('np-name').value.trim();
  const category = document.getElementById('np-cat').value;
  const cost = parseFloat(document.getElementById('np-cost').value) || 0;
  const priceToy = parseFloat(document.getElementById('np-priceToy').value) || 0;
  const priceShopee = parseFloat(document.getElementById('np-priceShopee').value) || priceToy;
  const priceDirect = parseFloat(document.getElementById('np-priceDirect').value) || priceToy;
  const stockHome = parseInt(document.getElementById('np-stockHome').value) || 0;
  const stockLocker = parseInt(document.getElementById('np-stockLocker').value) || 0;
  const lowThreshold = parseInt(document.getElementById('np-low').value) || 3;

  if(!name){ alert('Please enter a product name!'); return; }

  const newP = {
    id: uid(), sku: sku || ('NEW' + Math.floor(10 + Math.random()*89)),
    name, category, cost, priceToy, priceShopee, priceDirect, stockHome, stockLocker, lowThreshold
  };

  state.products.unshift(newP);
  saveState(); render();
}

function updateProductField(id, field, value){
  const p = state.products.find(p=>p.id===id);
  if(!p) return;
  if(field==='name' || field==='sku' || field==='category') p[field] = value;
  else p[field] = parseFloat(value) || 0;
  saveState();
}

function deleteProduct(id){
  if(!confirm('Delete product from catalog?')) return;
  state.products = state.products.filter(p=>p.id!==id);
  saveState(); render();
}

function logCompletedBatch(productId){
  const p = state.products.find(p=>p.id===productId);
  const inputEl = document.getElementById(`pq-printqty-${productId}`);
  const qtyPrinted = parseInt(inputEl?.value) || 0;
  if(!p || qtyPrinted<=0) return;

  p.stockHome += qtyPrinted;
  saveState(); render();
}

function quickTransferToLocker(productId, qty){
  const p = state.products.find(p=>p.id===productId);
  if(!p || qty<=0) return;
  if(p.stockHome < qty && !confirm(`Home Stock has ${p.stockHome}. Transfer ${qty} to locker anyway?`)){
    return;
  }
  p.stockHome = Math.max(0, p.stockHome - qty);
  p.stockLocker += qty;

  state.movements.unshift({
    id: uid(), date: new Date().toISOString().slice(0,10),
    type: 'restock', productId: p.id, qty, unitPrice: p.priceToy, note: 'Quick transfer from Print Queue'
  });

  saveState(); render();
}

// ---------- LOCKER MOVEMENTS & TRANSFERS ----------
function logMovement(){
  const productId = document.getElementById('mv-product').value;
  const type = document.getElementById('mv-type').value;
  const qty = parseInt(document.getElementById('mv-qty').value) || 0;
  const date = document.getElementById('mv-date').value || new Date().toISOString().slice(0,10);
  const note = document.getElementById('mv-note').value.trim();
  const p = state.products.find(p=>p.id===productId);
  if(!p || qty<=0) return;

  if(type==='restock'){
    if(p.stockHome < qty && !confirm(`You only have ${p.stockHome} in Home Stock. Restock locker by ${qty} anyway?`)){
      return;
    }
    p.stockHome = Math.max(0, p.stockHome - qty);
    p.stockLocker += qty;
  } else if(type==='sale' || type==='adjustment'){
    p.stockLocker = Math.max(0, p.stockLocker - qty);
  }

  state.movements.unshift({ id: uid(), date, type, productId, qty, unitPrice: p.priceToy, note });
  saveState(); render();
}

function autoConvertExpenseCost(){
  const curr = document.getElementById('exp-curr').value;
  const rawCost = parseFloat(document.getElementById('exp-rawcost').value) || 0;
  let sgd = rawCost;
  if(curr === 'RMB'){ sgd = rawCost * state.cnyRate; }
  document.getElementById('exp-costSgd').value = fmt(sgd);
}

function syncPresetExpense(){
  const preset = document.getElementById('exp-preset').value;
  if(preset && preset !== 'custom'){ document.getElementById('exp-item').value = preset; }
}

function addExpense(){
  const date = document.getElementById('exp-date').value || new Date().toISOString().slice(0,10);
  const item = document.getElementById('exp-item').value.trim();
  const vendor = document.getElementById('exp-vendor').value;
  const curr = document.getElementById('exp-curr').value;
  const rawCost = parseFloat(document.getElementById('exp-rawcost').value) || 0;
  const costSgd = parseFloat(document.getElementById('exp-costSgd').value) || 0;
  if(!item || costSgd <= 0) return;

  state.expenses.unshift({ id: uid(), date, item, vendor, curr, rawCost, costSgd });
  saveState(); render();
}

function addFilament(){
  const vendor = document.getElementById('fil-vendor').value;
  const brand = document.getElementById('fil-brand').value.trim();
  const color = document.getElementById('fil-color').value.trim();
  const costRmb = parseFloat(document.getElementById('fil-rmb').value) || 0;
  const costSgd = costRmb > 0 ? (costRmb * state.cnyRate) : (parseFloat(document.getElementById('fil-sgd').value) || 0);
  const weightGrams = parseInt(document.getElementById('fil-weight').value) || 1000;
  if(!brand) return;

  state.filaments.unshift({ id: uid(), vendor, brand, color, costRmb, costSgd, weightGrams });
  saveState(); render();
}

function updateFilamentWeight(id, val){
  const f = state.filaments.find(f=>f.id===id);
  if(f){ f.weightGrams = Math.max(0, parseInt(val)||0); saveState(); render(); }
}

function deleteFilament(id){
  state.filaments = state.filaments.filter(f=>f.id!==id);
  saveState(); render();
}

// ---------- ORDERS ----------
function autoFillOrderPrice(){
  const pid = document.getElementById('ord-product').value;
  const channel = document.getElementById('ord-channel').value;
  const p = state.products.find(p=>p.id===pid);
  if(!p) return;
  let price = p.priceDirect;
  if(channel==='Shopee') price = p.priceShopee;
  if(channel==='Toy Outpost') price = p.priceToy;
  document.getElementById('ord-price').value = price;
}

function addOrder(){
  const date = document.getElementById('ord-date').value || new Date().toISOString().slice(0,10);
  const customer = document.getElementById('ord-customer').value.trim();
  const channel = document.getElementById('ord-channel').value;
  const productId = document.getElementById('ord-product').value;
  const qty = parseInt(document.getElementById('ord-qty').value) || 1;
  const details = document.getElementById('ord-details').value.trim();
  const priceInput = parseFloat(document.getElementById('ord-price').value);
  const payment = document.getElementById('ord-pay').value;
  const status = document.getElementById('ord-status').value;

  const p = state.products.find(p=>p.id===productId);
  let defaultPrice = p ? p.priceDirect : 0;
  if(channel==='Shopee' && p) defaultPrice = p.priceShopee;
  if(channel==='Toy Outpost' && p) defaultPrice = p.priceToy;

  const unitPrice = isNaN(priceInput) ? defaultPrice : priceInput;
  const totalPrice = unitPrice * qty;

  if(p && channel !== 'Toy Outpost'){
    p.stockHome = Math.max(0, p.stockHome - qty);
  }

  state.orders.unshift({
    id: uid(), orderNo: 'KCO' + Math.floor(100 + Math.random()*900),
    date, customer: customer || channel, channel, productId, qty, details, unitPrice, totalPrice, nettReceived: totalPrice, payment, status
  });
  saveState(); render();
}

function calculatePrintCost(){
  const grams = parseFloat(document.getElementById('calc-grams').value) || 0;
  const filCostPerKg = parseFloat(document.getElementById('calc-filcost').value) || 21.45;
  const hours = parseFloat(document.getElementById('calc-hours').value) || 0;
  const watts = parseFloat(document.getElementById('calc-watts').value) || 150;
  const accCost = parseFloat(document.getElementById('calc-acc').value) || 0.55;
  const packCost = parseFloat(document.getElementById('calc-pack').value) || 0.40;
  const markupPct = parseFloat(document.getElementById('calc-markup').value) || 150;

  const matCost = (grams / 1000) * filCostPerKg;
  const kWh = (watts / 1000) * hours;
  const powerCost = kWh * state.sgElectricityRate;

  const totalCost = matCost + powerCost + accCost + packCost;
  const suggestedPrice = totalCost * (1 + markupPct / 100);
  const profit = suggestedPrice - totalCost;

  document.getElementById('calc-res-mat').innerText = '$' + fmt(matCost);
  document.getElementById('calc-res-power').innerText = '$' + fmt(powerCost);
  document.getElementById('calc-res-total').innerText = '$' + fmt(totalCost);
  document.getElementById('calc-res-price').innerText = '$' + fmt(suggestedPrice);
  document.getElementById('calc-res-profit').innerText = '$' + fmt(profit);
}

function calculateCostSandbox(){
  const grams = parseFloat(document.getElementById('sb-grams').value) || 0;
  const filPriceKg = parseFloat(document.getElementById('sb-filcost').value) || 21.45;
  const wasteCost = parseFloat(document.getElementById('sb-waste').value) || 0.20;
  const accCost = parseFloat(document.getElementById('sb-acc').value) || 0.55;
  const packCost = parseFloat(document.getElementById('sb-pack').value) || 0.40;
  const elecCost = parseFloat(document.getElementById('sb-elec').value) || 0.05;

  const filCost = (grams / 1000) * filPriceKg;
  const totalUnitCost = filCost + wasteCost + accCost + packCost + elecCost;

  document.getElementById('sb-res-fil').innerText = '$' + fmt(filCost);
  document.getElementById('sb-res-waste').innerText = '$' + fmt(wasteCost);
  document.getElementById('sb-res-acc').innerText = '$' + fmt(accCost);
  document.getElementById('sb-res-pack').innerText = '$' + fmt(packCost);
  document.getElementById('sb-res-elec').innerText = '$' + fmt(elecCost);
  document.getElementById('sb-res-unitcost').innerText = '$' + fmt(totalUnitCost);
}

function syncCalculatorFilament(){
  const fid = document.getElementById('calc-fil-select').value;
  const f = state.filaments.find(f=>f.id===fid);
  if(f && f.costSgd > 0){
    document.getElementById('calc-filcost').value = fmt(f.costSgd);
    calculatePrintCost();
  }
}

function renderTabs(){
  const needPrint = state.products.filter(p=>p.stockLocker < p.lowThreshold && p.stockHome < p.lowThreshold).length;
  const needRestock = state.products.filter(p=>p.stockLocker < p.lowThreshold && p.stockHome >= p.lowThreshold).length;

  const tabs = [
    ['summary', '📊 P&L'],
    ['printqueue', `🛈 Print & Restock Queue (${needPrint + needRestock})`],
    ['inventory', `📦 Catalog & Inventory (${state.products.length})`],
    ['orders', `🛒 Orders (${state.orders.length})`],
    ['log', '📝 Locker Activity'],
    ['expenses', `💸 Expenses (${state.expenses.length})`],
    ['filament', '🧵 Filament Stock'],
    ['costformula', '📐 Cost Formulas & Breakdown'],
    ['calculator', '⚡ SG Print Calculator']
  ];
  return `<div class="tabs">${tabs.map(([id,label])=>
    `<button class="tab ${state.activeTab===id?'active':''}" onclick="setTab('${id}')">${label}</button>`
  ).join('')}</div>`;
}

function renderSummary(){
  const year = state.pnlYear;
  const month = state.pnlMonth;

  const filteredOrders = state.orders.filter(o=>{
    if(o.payment==='Gift') return false;
    const y = o.date.slice(0,4);
    const m = o.date.slice(5,7);
    return (year === 'All' || y === year) && (month === 'All' || m === month);
  });

  const filteredExpenses = state.expenses.filter(e=>{
    const y = e.date.slice(0,4);
    const m = e.date.slice(5,7);
    return (year === 'All' || y === year) && (month === 'All' || m === month);
  });

  const lockerSales = state.movements.filter(m=>{
    if(m.type !== 'sale') return false;
    const y = m.date.slice(0,4);
    const mth = m.date.slice(5,7);
    return (year === 'All' || y === year) && (month === 'All' || mth === month);
  });

  const grossLocker = lockerSales.reduce((s,m)=>s + m.qty*m.unitPrice, 0);
  const lockerFee = grossLocker * (state.locker.feePct/100);

  const grossOrders = filteredOrders.reduce((s,o)=>s + (o.totalPrice || o.qty * o.unitPrice), 0);
  const totalGrossRevenue = grossLocker + grossOrders;

  const totalOperatingExp = filteredExpenses.reduce((s,e)=>s + e.costSgd, 0);
  const netProfit = (totalGrossRevenue - lockerFee) - state.locker.rent - totalOperatingExp;

  const mummyShare = Math.max(0, netProfit * 0.50);
  const klarissaShare = Math.max(0, netProfit * 0.20);
  const daddyShare = Math.max(0, netProfit * 0.20);
  const khylerShare = Math.max(0, netProfit * 0.10);

  return `
  <div class="card">
    <h2>📊 P&amp;L Financial Dashboard (Aug 2026 Onward)</h2>
    <p class="hint">Clean slate financial performance starting from tomorrow.</p>
    <div class="row" style="max-width:480px;margin-bottom:14px">
      <div class="field"><label>Filter Year</label>
        <select onchange="state.pnlYear=this.value; render();">
          <option value="All" ${year==='All'?'selected':''}>All Years</option>
          <option value="2026" ${year==='2026'?'selected':''}>2026</option>

      <div class="field"><label>Filter Month</label>

function renderPrintQueue(){
  const cat = state.queueCategory;

  const needPrintAll = state.products.filter(p=>p.stockLocker < p.lowThreshold && p.stockHome < p.lowThreshold);
  const needRestockAll = state.products.filter(p=>p.stockLocker < p.lowThreshold && p.stockHome >= p.lowThreshold);

  const needPrintList = needPrintAll.filter(p=> cat === 'All' || p.category === cat);
  const needRestockList = needRestockAll.filter(p=> cat === 'All' || p.category === cat);

  const catChips = ['All', ...CATEGORIES].map(c=>{
    const cntP = needPrintAll.filter(p=> c==='All' || p.category===c).length;
    const cntR = needRestockAll.filter(p=> c==='All' || p.category===c).length;
    const totalCount = cntP + cntR;
    return `
      <span class="cat-chip ${state.queueCategory===c?'active':''}" onclick="state.queueCategory='${c}'; render();">
        ${esc(c)} (${totalCount})
      </span>
    `;
  }).join('');

  const totalHomeVal = state.products.reduce((s,p)=>s+p.stockHome*p.cost,0);
  const totalLockerVal = state.products.reduce((s,p)=>s+p.stockLocker*p.cost,0);

  const printRows = needPrintList.map(p=>{
    const defaultPrintQty = Math.max(5, 10 - p.stockHome);
    return `<tr>
      <td><b>${esc(p.name)}</b><div class="msg">SKU: ${esc(p.sku)}</div></td>
      <td><span class="pill cat">${esc(p.category||'General')}</span></td>
      <td class="num"><span class="pill out">${p.stockLocker}</span></td>
      <td class="num"><span class="pill low">${p.stockHome}</span></td>
      <td class="num">
        <input id="pq-printqty-${p.id}" class="tbl-input num-in" style="width:70px;font-weight:bold;color:var(--lav-dark)" type="number" value="${defaultPrintQty}"> pcs
      </td>
      <td>
        <button class="btn sm" onclick="logCompletedBatch('${p.id}')">✅ Add Batch to Home Stock</button>
      </td>
    </tr>`;
  }).join('');

  const restockRows = needRestockList.map(p=>{
    const recTransfer = Math.min(p.stockHome, Math.max(3, 5 - p.stockLocker));
    return `<tr>
      <td><b>${esc(p.name)}</b><div class="msg">SKU: ${esc(p.sku)}</div></td>
      <td><span class="pill cat">${esc(p.category||'General')}</span></td>
      <td class="num"><span class="pill low">${p.stockLocker}</span></td>
      <td class="num"><span class="pill ok">${p.stockHome}</span></td>
      <td class="num"><b>${recTransfer} pcs</b></td>
      <td>
        <button class="btn sm ghost" onclick="quickTransferToLocker('${p.id}', ${recTransfer})">⚡ Transfer ${recTransfer} to Locker</button>
      </td>
    </tr>`;
  }).join('');

  return `
  <div class="card">
    <h2>🛈 Low Stock Summary Dashboard</h2>
    <div class="summary-grid">
      <div class="stat"><div class="label">Needs Printing</div><div class="value" style="color:var(--danger)">${needPrintAll.length} Items</div></div>
      <div class="stat"><div class="label">Needs Locker Restock</div><div class="value" style="color:var(--warn)">${needRestockAll.length} Items</div></div>
      <div class="stat"><div class="label">Total Home Inventory Cost</div><div class="value">$${fmt(totalHomeVal)}</div></div>
      <div class="stat"><div class="label">Total Locker Inventory Cost</div><div class="value">$${fmt(totalLockerVal)}</div></div>
    </div>
  </div>

  <div class="card">
    <h2>🎯 Filter Queue by Category Line</h2>
    <p class="hint">Click a category pill below to view low-stock print jobs for that specific brand line.</p>
    <div class="cat-bar">${catChips}</div>
  </div>

  <div class="card">
    <h2>🖨️ Action Required: Turn On 3D Printer (${needPrintList.length} Items in ${esc(cat)})</h2>
    <p class="hint">Both Suntec Locker and Home Stock are low (< 3). Set your intended print run and log completed batches.</p>
    ${needPrintList.length===0 ? `<div class="empty">🎉 All items in category "${esc(cat)}" are sufficiently stocked at Home! No urgent prints needed.</div>` : `
    <table>
      <tr><th>Product Name</th><th>Category</th><th class="num">Locker Stock</th><th class="num">Home Stock</th><th class="num">Quantity to Print</th><th>Action</th></tr>
      ${printRows}
    </table>`}
  </div>

  <div class="card">
    <h2>🚗 Action Required: Pack &amp; Restock Suntec Locker (${needRestockList.length} Items in ${esc(cat)})</h2>
    <p class="hint">Locker stock is low (< 3), but you already have printed items ready at Home. Restock the locker instantly below.</p>
    ${needRestockList.length===0 ? `<div class="empty">Locker is well stocked for category "${esc(cat)}" or waiting on prints above.</div>` : `
    <table>
      <tr><th>Product Name</th><th>Category</th><th class="num">Locker Stock</th><th class="num">Home Stock Ready</th><th class="num">Rec. Transfer</th><th>Action</th></tr>
      ${restockRows}
    </table>`}
  </div>`;
}

  return `
  <div class="card">
    <h2>Singapore 3D Printing Cost &amp; Pricing Calculator</h2>
    <p class="hint">Select active filament from inventory or type manual spool cost ($/kg).</p>
    <div class="row" style="margin-bottom:12px">
      <div class="field" style="flex:2"><label>Pull Filament Cost from Stock</label>
        <select id="calc-fil-select" onchange="syncCalculatorFilament()">
          <option value="">-- Manual Input or Select Below --</option>
          ${filOptions}
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field"><label>Filament Used (Grams)</label><input id="calc-grams" type="number" value="20" oninput="calculatePrintCost()"></div>
      <div class="field"><label>Filament Cost ($ / kg)</label><input id="calc-filcost" type="number" value="21.45" oninput="calculatePrintCost()"></div>
      <div class="field"><label>Print Time (Hours)</label><input id="calc-hours" type="number" step="0.1" value="1.5" oninput="calculatePrintCost()"></div>
      <div class="field"><label>Printer Power (Watts)</label><input id="calc-watts" type="number" value="150" oninput="calculatePrintCost()"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="field"><label>Accessories Cost ($)</label><input id="calc-acc" type="number" step="0.05" value="0.55" oninput="calculatePrintCost()"></div>
      <div class="field"><label>Packaging Cost ($)</label><input id="calc-pack" type="number" step="0.05" value="0.40" oninput="calculatePrintCost()"></div>
      <div class="field"><label>Desired Profit Markup (%)</label><input id="calc-markup" type="number" value="150" oninput="calculatePrintCost()"></div>
    </div>
  </div>
  <div class="card">
    <h2>Calculated Job Breakdown</h2>
    <div class="summary-grid">
      <div class="stat"><div class="label">Material Cost</div><div class="value" id="calc-res-mat">$0.00</div></div>
      <div class="stat"><div class="label">SG Electricity Cost</div><div class="value" id="calc-res-power">$0.00</div></div>
      <div class="stat"><div class="label">Total Unit Cost</div><div class="value" id="calc-res-total">$0.00</div></div>
      <div class="stat profit"><div class="label">Suggested Sell Price</div><div class="value pos" id="calc-res-price">$0.00</div></div>
      <div class="stat profit"><div class="label">Estimated Unit Profit</div><div class="value pos" id="calc-res-profit">$0.00</div></div>
    </div>
  </div>`;
}

loadState();
</script>
